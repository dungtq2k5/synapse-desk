syntax = "proto3";

package synapsedesk.ticket;

import "google/protobuf/timestamp.proto";

// Types shared by more than one service in the ticket package.
//
// PageRequest / PageMeta / SortOrder are NOT redeclared in this package. Each
// file that needs them imports `synapsedesk/auth/common.proto` directly and
// refers to them fully qualified, because protobuf has no way to merge two
// definitions of one message name — a second copy here would be a silent
// divergence the first time a field is added to only one of them, which is the
// exact hazard the auth package's own common.proto was created to avoid.
// (This file imports it only where it uses it; buf lint rejects an unused
// import, which is how it stays honest.)
//
// The cross-package import reads oddly (a ticket RPC taking a
// `synapsedesk.auth.PageRequest`), and the alternative was considered: promote
// them to a package-neutral `synapsedesk/common.proto`. That is the tidier end
// state, but moving them RENAMES every generated symbol the gateway and
// auth-service already import, and `buf breaking` would rightly flag it. Worth
// doing when there is a third consumer; not worth a breaking change for the
// second.

// Enumerated ticket columns.
//
// Values carry the enum-name prefix because protobuf enum values use C++
// scoping — they are SIBLINGS of their type, not children — so a bare
// `UNSPECIFIED` in two enums of one package is a compile error, not a style
// complaint.
enum TicketStatus {
  TICKET_STATUS_UNSPECIFIED = 0;
  TICKET_STATUS_NEW = 1;
  TICKET_STATUS_OPEN = 2;
  TICKET_STATUS_PENDING_AGENT = 3;
  TICKET_STATUS_ESCALATED = 4;
  TICKET_STATUS_RESOLVED = 5;
  TICKET_STATUS_CLOSED = 6;
}

enum TicketPriority {
  TICKET_PRIORITY_UNSPECIFIED = 0;
  TICKET_PRIORITY_LOW = 1;
  TICKET_PRIORITY_MEDIUM = 2;
  TICKET_PRIORITY_HIGH = 3;
  TICKET_PRIORITY_URGENT = 4;
}

enum TicketSource {
  TICKET_SOURCE_UNSPECIFIED = 0;
  TICKET_SOURCE_WEB = 1;
  TICKET_SOURCE_CHAT = 2;
  TICKET_SOURCE_EMAIL = 3;
  TICKET_SOURCE_API = 4;
}

enum ReassignmentReason {
  REASSIGNMENT_REASON_UNSPECIFIED = 0;
  REASSIGNMENT_REASON_INITIAL = 1;
  REASSIGNMENT_REASON_DEPARTMENT_CHANGE = 2;
  REASSIGNMENT_REASON_ESCALATION = 3;
  REASSIGNMENT_REASON_UNAVAILABLE = 4;
  REASSIGNMENT_REASON_LOAD_BALANCING = 5;
  REASSIGNMENT_REASON_SELF_ASSIGNED = 6;
  REASSIGNMENT_REASON_MANUAL = 7;
}

// A file on a message, or on the ticket's opening.
//
// Here rather than in message.proto because `TicketResponse` carries the
// opening's files, and message.proto already imports this file.
message AttachmentResponse {
  string id = 1;
  // Absent for a file on the ticket's opening, which has no message.
  optional string message_id = 2;
  string file_name = 3;
  string file_url = 4;
  int64 file_size_bytes = 5;
  string mime_type = 6;
  google.protobuf.Timestamp created_at = 7;
  // The ticket the file belongs to, through its message or directly.
  string ticket_id = 8;
}

// One already-uploaded object, waiting to be bound to a message or a ticket's
// opening.
//
// No size or MIME type: both are read back from the OBJECT at confirm, never
// taken from the client — the rule `confirmAttachment` already follows, and the
// reason a row cannot record whatever the caller felt like claiming.
message NewAttachment {
  string object_path = 1;
  string file_name = 2;
}

// A ticket as every read RPC returns it.
message TicketResponse {
  string id = 1;
  // int64 rather than the DB's BIGINT-as-BigInt: `longs: Number` in
  // GRPC_LOADER_OPTIONS makes this a plain JS number on both ends, which is
  // exact up to 2^53 and therefore fine for a ticket counter.
  int64 ticket_number = 2;
  string organization_id = 3;
  string author_id = 4;
  TicketSource source = 5;
  TicketStatus status = 6;
  TicketPriority priority = 7;
  string title = 8;
  string description = 9;
  optional string current_assignee_id = 10;
  optional string current_department_id = 11;
  optional google.protobuf.Timestamp escalated_at = 12;
  optional google.protobuf.Timestamp resolved_at = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  optional google.protobuf.Timestamp deleted_at = 16;
  optional string deleted_by_id = 17;

  // Messages on this ticket the CALLER has not read: not their own, not
  // internal notes they cannot see, not redacted, newer than their watermark.
  //
  // Zero for a ticket with nothing new, and the FULL count for one never
  // opened — a caller with no `ticket_read_states` row has read nothing, not
  // everything.
  //
  // **Always 0 on a SINGLE-ticket read**, and that is not a bug: a badge is a
  // list affordance, and a caller who fetched one ticket is reading it. Only
  // `ListTickets` fills this in. Both DTOs derive from here, so the rule lives
  // here — the REST one repeats it and the GraphQL one does not.
  //
  // On the list rather than a route of its own: a queue screen showing 25 rows
  // cannot mean 25 count requests.
  int32 unread_count = 18;

  // The files on the ticket's opening, uploaded with it; empty when none.
  // Every read fills it in: a file is signed only when downloaded, so a list
  // costs one join and no storage call.
  repeated AttachmentResponse attachments = 19;
}
