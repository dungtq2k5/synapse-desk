syntax = "proto3";

package synapsedesk.ingestion;

import "google/protobuf/timestamp.proto";
import "synapsedesk/auth/common.proto";
import "synapsedesk/ingestion/document.proto";

// The AI ledger's REMOTE write path — `ai_generations` keeps one writer.
//
// `rag-service` and `ticket-service` both produce spend, and neither reaches
// into postgres_ingestion to record it: service-per-database means the table
// has exactly one owner, and this is how the other two ask that owner to write.
//
// **The quota COUNTER is deliberately not here.** Every spending service
// increments `quota:{org}:{cycle}` in Redis directly (RDM §1.14.3).
// Routing the charge through this service would put a network round trip on the
// hot path of every AI request in order to avoid duplicating one key format —
// the wrong trade. The duplication is real and is handled by making the key
// builder a shared constant with a contract test on both sides.

// The ledger's enumerated values, declared HERE so both languages GENERATE
// them.
//
// These values now exist in TypeScript and in Python, and a hand-copied
// `GREETING_CLASSIFY` that becomes `GREETING_CLASSIFICATION` on one side meters
// into a purpose nothing queries. Nothing fails: rows are written, the counter
// increments, and every dashboard grouped by purpose simply omits them.
//
// The wire field stays a STRING (see `purpose` below) — what these enums fix is
// the VALUES, which is where the drift actually happens. A contract test on
// each side asserts its own enum matches this declaration.
enum AiGenerationPurpose {
  AI_GENERATION_PURPOSE_UNSPECIFIED = 0;
  AI_GENERATION_PURPOSE_CHAT_ANSWER = 1;
  AI_GENERATION_PURPOSE_DRAFT = 2;
  AI_GENERATION_PURPOSE_SUMMARY = 3;
  AI_GENERATION_PURPOSE_CLASSIFY = 4;
  AI_GENERATION_PURPOSE_SUGGESTIONS = 5;
  AI_GENERATION_PURPOSE_GREETING_CLASSIFY = 6;
  AI_GENERATION_PURPOSE_REFORMULATION = 7;
  AI_GENERATION_PURPOSE_EMBEDDING = 8;
  // The co-pilot's review pass. A distinct purpose because it is
  // a distinct cost: a draft with two review passes is three generations, and
  // folding them under DRAFT would make the per-draft cost look like one call.
  AI_GENERATION_PURPOSE_REVIEW = 9;
  // Layer B of prompt-injection detection on `Ask` and `Draft`.
  //
  // **Not booked by `Chat`**, whose detection is fused into the greeting
  // classification it was already making and stays under GREETING_CLASSIFY,
  // because it is the same call it always was. Two purposes for one job would
  // make the fused call look like a new cost that it is not.
  AI_GENERATION_PURPOSE_INJECTION_CLASSIFY = 10;
}

enum AiGenerationStatus {
  AI_GENERATION_STATUS_UNSPECIFIED = 0;
  AI_GENERATION_STATUS_SUCCESS = 1;
  // A failed call still consumed prompt tokens.
  AI_GENERATION_STATUS_FAILED = 2;
  // A cancelled stream still spent money on the tokens it produced.
  AI_GENERATION_STATUS_CANCELLED = 3;
}

// Drafts only, written after the fact when the agent acts — or when the hourly
// sweep gives up and calls it DISCARDED.
//
// **DISCARDED is what makes acceptance rate mean anything.** Without the sweep
// the denominator is drafts that were USED, and the metric reports ~100%
// regardless of quality.
enum AiGenerationOutcome {
  AI_GENERATION_OUTCOME_UNSPECIFIED = 0;
  AI_GENERATION_OUTCOME_ACCEPTED = 1;
  AI_GENERATION_OUTCOME_EDITED = 2;
  AI_GENERATION_OUTCOME_DISCARDED = 3;
}

message RecordGenerationRequest {
  string organization_id = 1;
  // Absent for system work — ingestion embeddings, scheduled jobs. Attributing
  // that spend to whoever last touched the tenant would be a guess.
  optional string user_id = 2;
  optional string ticket_id = 3;

  // AiGenerationPurpose, as a string. Enumerated columns are strings across
  // this system (development-conventions §7.3), and here it buys something
  // extra: a purpose added on one side does not need a proto change to be
  // recordable, so the two languages cannot deadlock on an enum bump.
  string purpose = 4;
  string model_name = 5;

  int32 prompt_tokens = 6;
  int32 completion_tokens = 7;
  optional int32 latency_ms = 8;
  // AiGenerationStatus, as a string — see `purpose` above. A FAILED call still consumed prompt tokens.
  string status = 9;

  // Populated for DRAFT and SUMMARY; absent for EMBEDDING and the
  // classification purposes, where it has no value and is most of the bytes.
  optional string content = 10;

  // What the generation SAW. Empty is the knowledge-gap signal, and it is a
  // signal rather than an omission.
  repeated string retrieved_chunk_ids = 11;
  // The subset it CITED. Always a subset; the difference is what the model was
  // given and chose not to use, and without it `UNCITED` is not computable.
  repeated string cited_chunk_ids = 12;

  // How many attachment parts the generation was GIVEN.
  //
  // **The missing axis on `empty_retrieval_rate`.** That rate is read as "the
  // corpus is failing to answer questions it should answer", and it is computed
  // over generations whose `retrieved_chunk_ids` is empty. A customer who
  // attaches an invoice and asks "what is my Q1 total?" retrieves nothing --
  // correctly, because the corpus was never the intended source -- and lands in
  // the numerator of a metric named for knowledge gaps.
  //
  // The existing filter is about PURPOSE and says so; this is about whether the
  // corpus was the intended source at all. Recorded rather than inferred,
  // because nothing else on this row can tell the two apart afterwards.
  //
  // Counts PARTS, not files the user attached: an attachment that was skipped
  // did not ground the answer, so it must not move this number. That makes it a
  // different question from `ChatRequest.attachment_count`, which asks what was
  // sent.
  int32 attachment_count = 13;
}

message RecordGenerationResponse {
  // Returned immediately, before the row is durable. The caller needs an id to
  // hand back to a client — it becomes `generatedFromId` on the reply that
  // closes the acceptance loop — and blocking on the write would make
  // bookkeeping a latency cost on a path that already spent the money.
  string generation_id = 1;
}

message RecordGenerationOutcomeRequest {
  string generation_id = 1;
  string resulting_message_id = 2;
  // The text as SENT. Compared against the stored draft to classify the
  // outcome, and compared NORMALISED — NFC, whitespace collapse, trim — or a
  // trailing newline reports as EDITED and understates the one metric that
  // justifies the co-pilot.
  string sent_text = 3;
}

message RecordGenerationOutcomeResponse {
  // ACCEPTED or EDITED. The caller needs this in its own response, which is why
  // this is a gRPC call rather than an event: it is an UPDATE to an existing
  // row, not an append of spend, so at-least-once delivery buys nothing and a
  // queue's ordering ambiguity is a liability.
  //
  // Unlike `purpose` and `status` above, this one is written and read entirely
  // in TypeScript — rag-service never calls this RPC — so the enum costs no
  // cross-language coordination.
  AiGenerationOutcome outcome = 1;
}

// AI spend and quality, from `ai_generation_daily_stats`.
//
// Never from `ai_generations` itself: that table is retention-rolled (RDM Table
// 29), so a query against raw rows silently loses history the moment retention
// ships — reporting a shrinking spend for a tenant whose usage is flat.
message AiUsageRequest {
  // Inclusive `YYYY-MM-DD` dates in the TENANT's timezone, matching the rollup.
  string from = 1;
  string to = 2;
  optional string granularity = 3;
}

// One (purpose, model) slice. **The per-purpose split is the point**: it shows
// a tenant where their AI budget actually goes, which is rarely where they
// assume.
message AiUsageSlice {
  string purpose = 1;
  string model_name = 2;
  int32 generations = 3;
  int64 prompt_tokens = 4;
  int64 completion_tokens = 5;
  // MICROS. The unit the ledger meters in — a float of currency accumulates
  // rounding error across a million rows (RDM §1.14).
  int64 cost_micros = 6;
  AiMeanValue latency_ms = 7;
  AiRateValue failure_rate = 8;
}

message AiUsagePoint {
  string day = 1;
  int32 generations = 2;
  int64 cost_micros = 3;
}

message AiUsageResponse {
  repeated AiUsagePoint points = 1;
  repeated AiUsageSlice by_purpose = 2;
  repeated AiUsageSlice by_model = 3;

  int64 total_cost_micros = 4;
  int32 total_generations = 5;

  // The budget the spend is measured AGAINST, so a caller does not need a
  // second round trip to auth-service to render a progress bar.
  int64 monthly_budget_micros = 6;
  // The enum `billing.proto` has used all along. This field spelled the same
  // fact as a string, which is drift rather than a decision.
  synapsedesk.auth.AiModelTier ai_model_tier = 7;

  // Draft quality, and its denominator needs the DISCARDED sweep
  // — without it, acceptance divides by drafts that were USED and reports
  // ~100% regardless of quality.
  AiRateValue draft_acceptance = 8;

  // **The knowledge-gap signal**: ATTACHMENT-FREE answering generations that
  // retrieved nothing.
  //
  // Both this and `KnowledgeGapsResponse.empty_retrieval_rate` publish the same
  // field name and must be computed over the same population -- two dashboards
  // disagreeing under one name reads as broken data rather than as two
  // definitions.
  AiRateValue empty_retrieval_rate = 9;

  optional google.protobuf.Timestamp computed_at = 10;

  // The last day `ai_generation_daily_stats` covers. See the note
  // on `ticket.OverviewResponse.data_through`; this is the same fact for a
  // different table, and the two can disagree when one scheduler is down.
  optional string data_through = 11;
}

// The knowledge-gap backlog: what the corpus could not answer, and what it
// answered badly.
message KnowledgeGapsRequest {
  string from = 1;
  string to = 2;
  int32 limit = 3;
}

message KnowledgeGapDocumentFlag {
  string document_id = 1;
  string document_title = 2;
  DocumentFlagType flag_type = 3;
  string detail = 4;
}

message KnowledgeGapsResponse {
  int32 empty_retrievals = 1;
  int32 answering_generations = 2;
  // Over ATTACHMENT-FREE answering generations only -- the population the
  // phrase describes. A question about a user's own file is one the corpus was
  // never expected to answer, so counting it conflates "the corpus had nothing"
  // with "the corpus should have had something".
  AiRateValue empty_retrieval_rate = 3;
  repeated KnowledgeGapDocumentFlag flags = 4;
  optional string data_through = 5;
  // The attachment-grounded slice, REPORTED rather than excluded.
  //
  // Dropping those rows would fix the rate and lose the signal that says a
  // corpus is being routed around: "how many answers came from user files" is
  // worth knowing on its own, and nothing else counts it.
  AiRateValue attachment_grounded_rate = 6;
  // How many of the attachment-grounded ones retrieved nothing -- the number
  // subtracted out of `empty_retrievals` above to get the rate.
  int32 attachment_empty_retrievals = 7;
}

// Corpus health — which documents earn their place.
message DocumentAnalyticsRequest {
  int32 limit = 1;
}

message DocumentUsageStat {
  string document_id = 1;
  string title = 2;
  int32 retrieval_count = 3;
  int32 citation_count = 4;
  int32 chunk_count = 5;
}

message DocumentAnalyticsResponse {
  repeated DocumentUsageStat most_cited = 1;
  // **Two DIFFERENT findings** (RDM Table 27), surfaced separately. Never
  // retrieved may just be mis-titled; retrieved and never cited is actively
  // displacing the sources that would have answered.
  repeated DocumentUsageStat never_retrieved = 2;
  repeated DocumentUsageStat retrieved_never_cited = 3;
  // Reads `document_chunks` counters written by `ChunkUsageProjection`, not the
  // daily rollup — so this reports the PROJECTION's freshness, which is the
  // thing that actually governs these three lists.
  optional string data_through = 4;
}

// ---------------------------------------------------------------------------
// Job health.
//
// **Alerting on staleness rather than on failure.** A failed job logs; a job
// that never ran logs nothing at all, which is precisely what happened here --
// seven scheduled jobs with no scheduler, producing zeros that every endpoint
// reported correctly. `last_succeeded_at` going stale fires for BOTH cases, and
// they are indistinguishable from outside.
message AiJobHealthRequest {}

message AiJobRunStatus {
  string job_name = 1;
  optional google.protobuf.Timestamp last_started_at = 2;
  // **Preserved across a failure**, deliberately -- this is what the staleness
  // check reads, and clearing it would turn "broken since Tuesday" into
  // "never ran".
  optional google.protobuf.Timestamp last_succeeded_at = 3;
  optional int32 last_duration_ms = 4;
  optional string last_error = 5;
  int32 consecutive_failures = 6;
}

message AiJobHealthResponse {
  repeated AiJobRunStatus items = 1;
}

message RunAiRollupRequest {
  optional string from = 1;
  optional string to = 2;
}

message RunAiRollupResponse {
  int32 tenants = 1;
  int32 rows = 2;
}

// A rate and the count it was computed over — mirrors the ticket surface.
//
// **Duplicated per package rather than shared, and PREFIXED.** A cross-package
// import would make `ingestion.proto` depend on `ticket.proto` for a two-field
// message — a dependency the ownership map deliberately does not have. The
// prefix is because ts-proto flattens every package into one TypeScript barrel,
// where two `RateValue` types collide at the export.
//
// The ARITHMETIC is not duplicated: both are produced by `analytics.config`, so
// the two surfaces cannot disagree about what a rate means.
message AiRateValue {
  optional double rate = 1;
  int32 numerator = 2;
  int32 denominator = 3;
}

message AiMeanValue {
  optional double mean = 1;
  int32 count = 2;
}

service AiLedgerService {
  rpc RecordGeneration(RecordGenerationRequest) returns (RecordGenerationResponse);
  rpc RecordGenerationOutcome(RecordGenerationOutcomeRequest) returns (RecordGenerationOutcomeResponse);

  rpc GetAiUsage(AiUsageRequest) returns (AiUsageResponse);
  rpc GetKnowledgeGaps(KnowledgeGapsRequest) returns (KnowledgeGapsResponse);
  rpc GetDocumentAnalytics(DocumentAnalyticsRequest) returns (DocumentAnalyticsResponse);

  // Platform-operated, like the ticket rollup.
  rpc RunAiRollup(RunAiRollupRequest) returns (RunAiRollupResponse);
  rpc GetAiJobHealth(AiJobHealthRequest) returns (AiJobHealthResponse);
}
