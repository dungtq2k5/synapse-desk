# storage-service — no Prisma schema, so no init container. Its Firebase
# credential sits at the PACKAGE ROOT rather than under `secrets/`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-service
  labels:
    app.kubernetes.io/name: storage-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: storage-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-service
    spec:
      terminationGracePeriodSeconds: 45
      # Nothing in this pod talks to the Kubernetes API, so the token that
      # would otherwise be mounted at
      # /var/run/secrets/kubernetes.io/serviceaccount is a credential with no
      # reader and a real blast radius — it is what an SSRF or an RCE reaches
      # for first. Off by declaration rather than by there being no RoleBinding:
      # an unbound token still authenticates, and the default is `true`.
      automountServiceAccountToken: false
      containers:
        - name: storage-service
          image: us-central1-docker.pkg.dev/synapsedesk/services/storage-service:0c1c9e9270ec82b834a0b4914990c41a28f15d16
          # The tag is a commit sha and therefore immutable; re-pulling it can
          # only cost time. Declared rather than left to the default, which
          # changes meaning with the tag shape.
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50253
          envFrom:
            - configMapRef:
                name: storage-service-config
            - secretRef:
                name: storage-service-secret
          livenessProbe:
            grpc:
              port: 50253
              service: ''
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 50253
              service: 'readiness'
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            # `FIREBASE_STORAGE_SERVICE_ACCOUNT_PATH` is
            # `./serviceAccountKey.json` — the package root, which
            # `docker/node-service.Dockerfile` already names as the exception to
            # the `secrets/` convention.
            - name: storage-service-account
              mountPath: /app/apps/storage-service/serviceAccountKey.json
              subPath: serviceAccountKey.json
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 320Mi
              ephemeral-storage: 256Mi
            limits:
              memory: 640Mi
              ephemeral-storage: 1Gi
      volumes:
        - name: storage-service-account
          secret:
            secretName: storage-service-files
---
apiVersion: v1
kind: Service
metadata:
  name: storage-service
  labels:
    app.kubernetes.io/name: storage-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: storage-service
  ports:
    - name: grpc
      port: 50253
      targetPort: grpc
