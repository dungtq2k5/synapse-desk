# api-gateway — the only Deployment with an Ingress, and the only pod a user
# reaches directly. The Service below selects it by the
# `app.kubernetes.io/name: api-gateway` label.
#
# Probes are HTTP here and gRPC everywhere else, because this is the one service
# with an HTTP listener. `/health` and `/health/ready` are served OUTSIDE the
# `/api/v1` prefix: an orchestrator is not an API client and cannot follow a
# version migration.
#
# **No init container.** api-gateway owns no Prisma schema — ADR 0043.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
    spec:
      # Longer than (readiness periodSeconds x failureThreshold) plus the
      # in-flight drain, and the NATS consumers' and socket server's stop after it.
      terminationGracePeriodSeconds: 45
      # Nothing in this pod talks to the Kubernetes API, so the token that
      # would otherwise be mounted is a credential with no reader and a real
      # blast radius. Off by declaration rather than by there being no
      # RoleBinding: an unbound token still authenticates.
      automountServiceAccountToken: false
      containers:
        - name: api-gateway
          # A real tag, never a placeholder — CD rewrites it per deploy.
          # `:latest` is worse here than in compose for two reasons:
          # `imagePullPolicy` defaults to `Always` on it, so every restart can
          # pull different code; and `kubectl rollout undo` restores a pod SPEC,
          # so a spec naming a moving pointer rolls back to the same pointer. A
          # code rollback is the only rollback this system has (ADR 0044).
          image: us-central1-docker.pkg.dev/synapsedesk/services/api-gateway:0c1c9e9270ec82b834a0b4914990c41a28f15d16
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
            # netty-socketio cannot share Tomcat's port, so Socket.IO has its
            # own, `WS_PORT`.
            - name: ws
              containerPort: 3001
            - name: metrics
              containerPort: 9464
          # Named `api-gateway-*`, not `-java`: `generate-k8s-config.mjs` names
          # them after the directory that holds `.env.example`.
          envFrom:
            - configMapRef:
                name: api-gateway-config
            - secretRef:
                name: api-gateway-secret
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            # A JVM's startup takes this long, and a liveness probe that fired
            # during it would restart the pod on a loop.
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            # `JWT_*_PUBLIC_KEY_PATH` is `./secrets/*.pub` and the image's
            # WORKDIR is `/app`, so this is where those relative paths
            # resolve. Public halves only — this gateway verifies, never mints.
            - name: jwt-public
              mountPath: /app/secrets
              readOnly: true
          resources:
            requests:
              cpu: 200m
              # A JVM's floor is its heap plus metaspace.
              memory: 768Mi
              ephemeral-storage: 256Mi
            limits:
              memory: 1536Mi
              ephemeral-storage: 1Gi
      volumes:
        - name: jwt-public
          secret:
            secretName: api-gateway-jwt-public
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 3000
      targetPort: http
    - name: ws
      port: 3001
      targetPort: ws
    - name: metrics
      port: 9464
      targetPort: metrics
