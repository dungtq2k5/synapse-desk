# api-gateway — the Service every client and the Ingress reach, and the only
# one with an Ingress. The Deployment behind it is in `api-gateway-java.yaml`,
# selected by the `app.kubernetes.io/name: api-gateway` label.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 3000
      targetPort: http
    - name: ws
      port: 3001
      targetPort: ws
    - name: metrics
      port: 9464
      targetPort: metrics
