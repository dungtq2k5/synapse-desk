# The one Ingress — the routing-and-TLS half of the ingress requirement, ADR 0043.
#
# **`ingress-nginx`, one origin, two backends.** The browser sees a single
# origin: `/api`, `/graphql` and `/socket.io` go to the gateway, everything
# else to `web`, the web client's renderer. Cookies are therefore first-party
# and nothing needs CORS. The five gRPC services and rag-service have
# `ClusterIP` Services and nothing else: they are reachable from inside the
# cluster and from nowhere else, which is the property
# `AUTH_SERVICE_URL = auth-service:5001` already assumes.
#
# **Not routed:** the gateway's `/health`, `/health/ready`, `/version` and
# `/v3/api-docs`. Probes are in-cluster, and Swagger is off in the cluster.
#
# **Exactly one trusted hop, and this controller is it.** The gateway reads the
# caller's IP with `ClientIp` (`common/web`): the rightmost `X-Forwarded-For`
# entry, the one this controller appends, else the connection's peer. Front this
# controller with a second proxy and that entry becomes the proxy's address —
# which feeds `device_sessions.ip_address`, the throttle buckets, the WebSocket
# handshake budget and the audit log. A page `web` renders calls the gateway's
# Service directly and forwards the header it received, unchanged, so the
# rightmost entry is still the browser's; `policy/api-gateway-ingress.yaml`
# keeps every other pod off the gateway's HTTP port.
#
# **The metrics port is deliberately not routed.** `METRICS_PORT = 9464` is its
# own listener so that "not reachable from the internet" is structural rather
# than an ingress rule; there is no path here that reaches it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
  annotations:
    # WebSocket upgrades need a read timeout longer than the default 60s or an
    # idle socket is closed under the client. `pingInterval` is Socket.IO's
    # default 25s, so 3600 leaves the server's own keepalive in charge.
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    # **No session affinity, on purpose.** It would work and it is the wrong
    # fix: `SecureGateway` pins `transports: ['websocket']`, so there is no
    # polling handshake that needs to land on the same replica, and affinity
    # would cost the even distribution `@socket.io/redis-adapter` exists to
    # allow.
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Socket.IO listens on its own port in both implementations; the
          # longer prefix wins over `/`, so the handshake and its upgrade go
          # there.
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: ws
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
