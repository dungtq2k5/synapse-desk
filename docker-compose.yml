services:
  # ---------------------------------------------------------------------------
  # Database Layer (Isolated Postgres Databases per Domain)
  # ---------------------------------------------------------------------------
  postgres-auth:
    image: postgres:18.4-alpine
    container_name: synapsedesk-postgres-auth
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
      # Read by init-test-db.sh below — POSTGRES_DB only auto-creates ONE
      # database on first init, so the test database needs its own script.
      AUTH_TEST_DB_NAME: ${AUTH_TEST_DB_NAME}
    ports:
      - '${AUTH_DB_PORT}:5432'
    volumes:
      - pgdata_auth:/var/lib/postgresql
      # Postgres executes every file here exactly once, on first init against
      # an EMPTY volume — see the script's own header for what that means for
      # an already-initialized `pgdata_auth`.
      - ./docker/postgres-auth/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-ticket:
    image: postgres:18.4-alpine
    container_name: synapsedesk-postgres-ticket
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${TICKET_DB_NAME}
    ports:
      - '${TICKET_DB_PORT}:5432'
    volumes:
      - pgdata_ticket:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-ingestion:
    image: postgres:18.4-alpine
    container_name: synapsedesk-postgres-ingestion
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${INGESTION_DB_NAME}
    ports:
      - '${INGESTION_DB_PORT}:5432'
    volumes:
      - pgdata_ingestion:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # Domain E's own database.
  #
  # Added when the quota alert became the first LOAD-BEARING consumer of the
  # in-app notification subject: the alert was published correctly, idempotently
  # and to the right audience, into a subject with no subscriber. Everything
  # about it looked finished except that nobody was ever told.
  postgres-notification:
    image: postgres:18.4-alpine
    container_name: synapsedesk-postgres-notification
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
    ports:
      - '${NOTIFICATION_DB_PORT}:5432'
    volumes:
      - pgdata_notification:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Message Queue & Cache Layer
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8.8.0-alpine
    container_name: synapsedesk-redis
    # **The eviction policy is stated, not inherited.**
    #
    # **`noeviction`, and `volatile-ttl` was tried and is wrong.** The reasoning
    # that produced it was sound about the quota counter and wrong about BullMQ:
    # `quota:{org}:{cycle}` carries a ~70-day expiry, so under `volatile-ttl` it
    # is evicted last, which is what `allkeys-lru` and `volatile-lru` both get
    # dangerously wrong (the counter is COLD — written once per generation, read
    # once per gate check — so recency-based policies discard it and reset a
    # tenant's metered spend mid-cycle).
    #
    # What that reasoning missed is that **BullMQ locks DO carry an expiry**, and
    # it is the shortest one in the instance. From BullMQ's own Lua:
    #
    # rcall("SET", jobKey. ':lock', token, "PX", opts['lockDuration'])
    #
    # `lockDuration` defaults to 30s, against cache entries at 60s–1h and the
    # quota counter at 70 days. `volatile-ttl` evicts NEAREST-EXPIRY FIRST, so
    # the job locks go before anything else — and an evicted lock is not a lost
    # cache entry, it is a job the stalled-checker returns to the queue and a
    # worker runs a SECOND time. Duplicate ingestion, duplicate exports, and
    # silent. That is what every worker's startup banner was reporting:
    #
    #     IMPORTANT! Eviction policy is volatile-ttl. It should be "noeviction"
    #
    # **On one shared instance there is no policy that spares both**, which is
    # the real finding: cache keys sit between the locks and the counter on every
    # ordering available. `noeviction` is therefore the only setting that cannot
    # silently corrupt something — when memory fills, writes FAIL, loudly, and a
    # failed write is a visible error rather than a job running twice.
    #
    # The cost is the original worry: a full instance fails every writer,
    # not just the cache. That is accepted deliberately here, because the cache
    # is the component that bounds itself (every entry has a TTL) and a loud
    # failure is recoverable in a way a duplicated side effect is not.
    #
    # **The real fix is the second Redis instance** — deferred —
    # which lets the cache have an eviction policy of its own without BullMQ or
    # the quota counter sharing the consequences. Until then this is the safe
    # configuration rather than the ideal one.
    #
    # `maxmemory` stays set so the ceiling is explicit: without it the container
    # grows until the OOM killer decides, which is the same failure with no error
    # message. 512mb is a dev figure; production sizes it against the real key
    # count.
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: synapsedesk-nats
    # `-sd /data` is NOT optional and NOT a tuning choice. Without it JetStream
    # defaults its store into /tmp, inside the container's writable layer — so
    # the volume below sits mounted, named and empty, and every persisted
    # message dies with the next `compose up`. A durable subject on that broker
    # is worse than a core one: core loses the message visibly, JetStream acks
    # the publisher first. `assertDurableStore` refuses to boot against it.
    command:
      ['-js', '-sd', '/data', '-m', '${NATS_DASHBOARD_PORT}'] # JetStream with a PERSISTENT store, + monitoring on 8222
    ports:
      - '${NATS_PORT}:4222' # NATS Client Port
      - '${NATS_DASHBOARD_PORT}:8222' # HTTP Management/Monitoring UI
    volumes:
      - nats_data:/data

  # ---------------------------------------------------------------------------
  # AI & Vector Search Engine Layer
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: synapsedesk-qdrant
    ports:
      - '${QDRANT_PORT}:6333' # HTTP API / Dashboard
      - '${QDRANT_GRPC_PORT}:6334' # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage

  # The Firebase Storage EMULATOR.
  #
  # Tests point here instead of at a real bucket, for the same reason they point
  # at a test database instead of the dev one: a suite that deletes objects
  # would otherwise delete real customer files. It is also what lets the storage
  # suite run on a fresh clone with no Google project at all.
  firebase-storage:
    image: andreysenov/firebase-tools:latest
    container_name: synapsedesk-firebase-storage
    working_dir: /home/node
    command: firebase emulators:start --only storage --project synapsedesk-test
    ports:
      - '9199:9199'
    volumes:
      - ./docker/firebase:/home/node

volumes:
  pgdata_auth:
  pgdata_ticket:
  pgdata_ingestion:
  pgdata_notification:
  redis_data:
  nats_data:
  qdrant_data:

networks:
  default:
    name: synapsedesk-network