services:
  # ---------------------------------------------------------------------------
  # Database Layer (Isolated Postgres Databases per Domain)
  # ---------------------------------------------------------------------------
  postgres-auth:
    image: postgres:18.4-alpine
    container_name: synapsedesk-postgres-auth
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
      # Read by init-test-db.sh below — POSTGRES_DB only auto-creates ONE
      # database on first init, so the test database needs its own script.
      AUTH_TEST_DB_NAME: ${AUTH_TEST_DB_NAME}
    ports:
      - '${AUTH_DB_PORT}:5432'
    volumes:
      - pgdata_auth:/var/lib/postgresql
      # Postgres executes every file here exactly once, on first init against
      # an EMPTY volume — see the script's own header for what that means for
      # an already-initialized `pgdata_auth`.
      - ./docker/postgres-auth/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-ticket:
    image: postgres:18.4-alpine
    container_name: synapsedesk-postgres-ticket
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${TICKET_DB_NAME}
    ports:
      - '${TICKET_DB_PORT}:5432'
    volumes:
      - pgdata_ticket:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-ingestion:
    image: postgres:18.4-alpine
    container_name: synapsedesk-postgres-ingestion
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${INGESTION_DB_NAME}
    ports:
      - '${INGESTION_DB_PORT}:5432'
    volumes:
      - pgdata_ingestion:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # Domain E's own database — 16-doc §1.
  #
  # Added when the quota alert became the first LOAD-BEARING consumer of the
  # in-app notification subject: the alert was published correctly, idempotently
  # and to the right audience, into a subject with no subscriber. Everything
  # about it looked finished except that nobody was ever told.
  postgres-notification:
    image: postgres:18.4-alpine
    container_name: synapsedesk-postgres-notification
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
    ports:
      - '${NOTIFICATION_DB_PORT}:5432'
    volumes:
      - pgdata_notification:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Message Queue & Cache Layer
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8.8.0-alpine
    container_name: synapsedesk-redis
    # **The eviction policy is stated, not inherited** — 31-doc C1.
    #
    # Redis defaults to `noeviction`, which was fine while this instance held a
    # bounded set of keys. The cache is the first component that writes a large
    # number of them, and this instance also holds things that must not fail:
    # the AI spend counter (`quota:{org}:{cycle}`), throttler state, BullMQ
    # queues and the Socket.IO adapter. Under `noeviction` a full instance
    # fails every WRITE — the cache degrades gracefully by design and nothing
    # else here does.
    #
    # `volatile-ttl` evicts keys that have an expiry, nearest-expiry first, and
    # that ordering is what makes it the right choice rather than a compromise:
    #
    #   - Cache entries expire in 60s–1h, so they go first — which is exactly
    #     what a cache is for.
    #   - `quota:{org}:{cycle}` carries a 70-DAY expiry, so it is last among
    #     volatile keys. This is the case `allkeys-lru` gets badly wrong: the
    #     counter is written once per generation and read once per gate check,
    #     so it is COLD, and LRU would evict it and reset a tenant's metered
    #     spend to zero mid-cycle.
    #   - `volatile-lru` fails the same way for the same reason. Ordering by
    #     remaining TTL rather than by recency is the whole difference.
    #   - BullMQ job keys carry no expiry at all, so they are outside the
    #     volatile set and cannot be evicted.
    #
    # `maxmemory` has to be set or the policy never applies. 512mb is a dev
    # figure; production sizes this against the real key count. A second Redis
    # for cache keys is the thorough fix and stays deferred (28-doc §7) — this
    # is what makes the shared instance safe until then.
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - volatile-ttl
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: synapsedesk-nats
    command: ['-js', '-m', '${NATS_DASHBOARD_PORT}'] # Enable JetStream (-js) and Monitoring Dashboard (-m 8222)
    ports:
      - '${NATS_PORT}:4222' # NATS Client Port
      - '${NATS_DASHBOARD_PORT}:8222' # HTTP Management/Monitoring UI
    volumes:
      - nats_data:/data

  # ---------------------------------------------------------------------------
  # AI & Vector Search Engine Layer
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: synapsedesk-qdrant
    ports:
      - '${QDRANT_PORT}:6333' # HTTP API / Dashboard
      - '${QDRANT_GRPC_PORT}:6334' # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage

  # The Firebase Storage EMULATOR — §1.7.
  #
  # Tests point here instead of at a real bucket, for the same reason they point
  # at a test database instead of the dev one: a suite that deletes objects
  # would otherwise delete real customer files. It is also what lets the storage
  # suite run on a fresh clone with no Google project at all.
  firebase-storage:
    image: andreysenov/firebase-tools:latest
    container_name: synapsedesk-firebase-storage
    working_dir: /home/node
    command: firebase emulators:start --only storage --project synapsedesk-test
    ports:
      - '9199:9199'
    volumes:
      - ./docker/firebase:/home/node

volumes:
  pgdata_auth:
  pgdata_ticket:
  pgdata_ingestion:
  pgdata_notification:
  redis_data:
  nats_data:
  qdrant_data:

networks:
  default:
    name: synapsedesk-network