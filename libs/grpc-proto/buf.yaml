version: v2

# Paths are relative to THIS file, so buf config lives next to the protos it
# governs and `libs/grpc-proto` stays self-contained.
modules:
  - path: src/proto

lint:
  use:
    - STANDARD
  ignore:
    # Vendored verbatim from grpc/grpc-proto. Every name here is the wire
    # contract Kubernetes probes natively — `Health`, `SERVING`, `UNKNOWN` —
    # so STANDARD's naming rules cannot be satisfied without breaking the one
    # property the file exists for: renaming `Health` to `HealthService` makes
    # `buf lint` green and the kubelet's probe wrong. Excluded by PATH, not by
    # rule, so synapsedesk's own protos keep the full rule set.
    - src/proto/grpc
  except:
    # STANDARD requires a version suffix (`synapsedesk.auth.v1`). Skipped
    # deliberately: this package is internal to the monorepo — both peers ship
    # from one repo, so there is never a need to run two incompatible versions
    # side by side, and additive-only changes cover the rolling-deploy window.
    #
    # The tradeoff is that `buf breaking` becomes the ONLY guard against a
    # wire-incompatible change, since there is no v2 escape hatch. Keep it in CI.
    - PACKAGE_VERSION_SUFFIX
    # STANDARD requires every RPC to have its own uniquely-named request and
    # response message (`<Method>Request` / `<Method>Response`). That rule exists
    # so one RPC's payload can evolve without dragging another's along, and it is
    # a good default — but here the sharing is deliberate and load-bearing:
    #
    #   Login / LoginWithTenant / GoogleSignIn  -> all return LoginResponse
    #   VerifyEmail / VerifyPhone               -> share VerifyOtpRequest/Response
    #
    # The gateway's `toLoginResult()` exists precisely because those three RPCs
    # return one shape; splitting them would mean three identical messages and
    # three identical mappers — the exact silent-divergence hazard that
    # common.proto was created to avoid.
    #
    # Revisit if any of these responses ever needs to diverge: at that point the
    # split is real work rather than a rename, and the rule should come back on.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    # The zero value of `UserProjection` is a real choice, not an absence:
    # `USER_PROJECTION_NOTIFICATION = 0` is what every existing caller means by
    # sending nothing, and its own comment says so. Renaming it to
    # `_UNSPECIFIED` would satisfy this rule and cost more than it buys:
    #
    #   - `buf breaking` REJECTS it — measured. `ENUM_VALUE_SAME_NAME` is part
    #     of `FILE`, which the breaking config below uses. The change is
    #     wire-compatible and SOURCE-breaking, and suppressing the one guard
    #     this file calls "the ONLY guard against a wire-incompatible change"
    #     is the wrong trade for a naming rule.
    #   - it would not even buy distinguishability: proto3 cannot tell an
    #     absent enum from its zero value, so the field would read
    #     `UNSPECIFIED` and behave as "notification". Actually separating them
    #     needs `UNSPECIFIED = 0` PLUS `NOTIFICATION = 2` and all twelve call
    #     sites — a real change with a real benefit, and not a lint fix.
    #
    # Revisit when that distinction is actually needed.
    - ENUM_ZERO_VALUE_SUFFIX

breaking:
  use:
    - FILE
