syntax = "proto3";

package synapsedesk.notification;

import "google/protobuf/timestamp.proto";

// Domain E's read surface
//
// notification-service was NATS-only until this file existed: it consumed
// events and wrote rows nobody could read back. The feed is a synchronous read
// on behalf of a user, so it needs gRPC exactly as ticket-service does.
//
// **Every RPC here is SELF-scoped.** The recipient is `ctx.sub` from gRPC
// metadata, never a field on the request — there is no admin
// read-someone-else's-inbox RPC and there should not be one. The feed is a
// personal inbox, and anything a supervisor legitimately needs is in
// `audit_logs`.
//
// Note what is ABSENT: there is no Create. Notifications are written by NATS
// consumers, never by a caller. An RPC would be a spam vector into other
// users' inboxes and would bypass the `event_id` idempotency that makes NATS
// at-least-once delivery safe.

// Mirrors `NotificationPriority` in `@synapsedesk/common` — RDM Table 23.
//
// **A CLOSED set, unlike `type` below.** The four levels come from the table
// and no producer invents a fifth, which is exactly the property that makes an
// enum right here and wrong there.
//
// `LOW` and `HIGH` are declared and nothing branches on them yet — they behave
// as `NORMAL`. They are on the wire regardless: a producer needs
// somewhere to put "this matters more than a reply", and a value that survives
// the round trip can be acted on later without a proto change. `CRITICAL` is
// the one that already means something — it bypasses quiet hours and digest
// batching, so reading it as anything else silently mutes an alert.
enum NotificationPriority {
  NOTIFICATION_PRIORITY_UNSPECIFIED = 0;
  NOTIFICATION_PRIORITY_LOW = 1;
  NOTIFICATION_PRIORITY_NORMAL = 2;
  NOTIFICATION_PRIORITY_HIGH = 3;
  NOTIFICATION_PRIORITY_CRITICAL = 4;
}

message NotificationResponse {
  string id = 1;
  string organization_id = 2;
  // The ORIGINATING event — `ticket.assigned`, `quota.threshold`. Never the
  // transport subject.
  //
  // Stays a `string` where `priority` below became an enum, and the difference
  // is open set versus closed: every producer that emits a new event adds a
  // type, so an enum here would mean a proto change per notification.
  string type = 3;
  NotificationPriority priority = 4;
  string title = 5;
  optional string body = 6;
  // JSON, as a string. proto3 has no map<string, any>, and a `Struct` would
  // make every client depend on the well-known types to read a deep-link
  // payload it forwards verbatim.
  string data = 7;
  optional string action_url = 8;
  optional string actor_id = 9;
  optional string resource_type = 10;
  optional string resource_id = 11;
  optional string group_key = 12;
  int32 group_count = 13;
  optional google.protobuf.Timestamp read_at = 14;
  optional google.protobuf.Timestamp archived_at = 15;
  google.protobuf.Timestamp created_at = 16;
}

// CURSOR pagination, not offset
//
// The feed grows at the head while it is being read, so an offset shifts rows
// under the reader: page 2 silently repeats a row or skips one, and neither is
// visible to the client. The cursor is the last row's id, and `created_at` is
// carried with it because two rows can share a millisecond.
message ListNotificationsRequest {
  optional string type = 1;
  bool unread_only = 2;
  bool include_archived = 3;
  // Opaque to the caller. Encodes (created_at, id) — see `feed.cursor.ts`.
  optional string cursor = 4;
  int32 limit = 5;
}

message ListNotificationsResponse {
  repeated NotificationResponse items = 1;
  // Absent when this was the last page, so a client stops rather than
  // polling a cursor that returns nothing forever.
  optional string next_cursor = 2;
  bool has_more = 3;
}

message UnreadCountResponse { int32 count = 1; }

message NotificationIdRequest { string id = 1; }

// Bulk read, two shapes
//
// `{ resourceType, resourceId }` is the one that makes the feature usable
// rather than annoying: opening ticket #1042 clears all twelve of its
// notifications in one call.
message MarkReadRequest {
  repeated string ids = 1;
  optional string resource_type = 2;
  optional string resource_id = 3;
}

message MarkReadResponse {
  int32 updated = 1;
  // Pushed back so the client never has to recompute a badge it can be told.
  int32 unread_count = 2;
}

// Enums rather than the strings these used to be, per the rule `OrgStatus`
// established: the wire format rejects an unknown value before any handler
// runs, which is a stronger gate than a runtime check somebody has to remember
// to write. notification-service was writing exactly those checks by hand —
// `validateChannel` and `validateDigest` — and comparing `String(value)`
// against the domain enum precisely because the value arrived unconstrained.
//
// Values carry the enum-name prefix because protobuf enum values use C++
// scoping: they are SIBLINGS of their type, so a bare `UNSPECIFIED` in two
// enums of one package is a compile error.
//
// Note `type` stays a `string` deliberately. It is an OPEN set — every producer
// that emits a new event adds one — so an enum there would mean a proto change
// on every new notification, and an unknown type must degrade to "no
// preference row" rather than being refused at the transport.

// Mirrors `NotificationChannel` in `@synapsedesk/common` — RDM Table 24.
//
// `WEBHOOK` is present for completeness and is NOT a valid preference: it has
// no implementation, so a preference for it would control nothing.
// That exclusion stays in the service layer, because it is a policy about which
// channels are configurable, not a statement about which channels exist.
enum NotificationChannel {
  NOTIFICATION_CHANNEL_UNSPECIFIED = 0;
  NOTIFICATION_CHANNEL_IN_APP = 1;
  NOTIFICATION_CHANNEL_EMAIL = 2;
  NOTIFICATION_CHANNEL_SMS = 3;
  NOTIFICATION_CHANNEL_WEBHOOK = 4;
}

// Mirrors `DigestMode` in `@synapsedesk/common` — RDM Table 25.
//
// `HOURLY` and `DAILY` are read by the resolver but the SCHEDULER is deferred
//, so only `IMMEDIATE` and `OFF` change behaviour today. They are
// on the wire anyway: a user can choose one, and the value must survive the
// round trip rather than being silently rewritten.
enum DigestMode {
  DIGEST_MODE_UNSPECIFIED = 0;
  DIGEST_MODE_IMMEDIATE = 1;
  DIGEST_MODE_HOURLY = 2;
  DIGEST_MODE_DAILY = 3;
  DIGEST_MODE_OFF = 4;
}

// Where a resolved value came from — mirrors `PreferenceSource` in
// `@synapsedesk/common`.
enum PreferenceSource {
  PREFERENCE_SOURCE_UNSPECIFIED = 0;
  // A row for this exact (type, channel).
  PREFERENCE_SOURCE_EXPLICIT = 1;
  // A row for `'*'` on this channel.
  PREFERENCE_SOURCE_WILDCARD = 2;
  // No row at all — the permissive floor.
  PREFERENCE_SOURCE_DEFAULT = 3;
}

// The RESOLVED value plus where it came from
//
// `source` is what lets the UI show "inherited" rather than pretending every
// value was chosen. A settings screen that renders a default as a choice is one
// the user cannot reason about.
message PreferenceResponse {
  string type = 1;
  NotificationChannel channel = 2;
  bool is_enabled = 3;
  DigestMode digest = 4;
  PreferenceSource source = 5;
}

// Empty: the catalogue is for the CALLER, whose id is in metadata.
message ListPreferencesRequest {}

message ListPreferencesResponse { repeated PreferenceResponse items = 1; }

// The same two concepts as `PreferenceResponse`, so the same two types. A
// request that named a channel as a string while the response answered with an
// enum would be one field with two wire formats, and the mapping between them
// would live in whichever caller remembered to write it.
message UpdatePreferenceRequest {
  string type = 1;
  NotificationChannel channel = 2;
  optional bool is_enabled = 3;
  // No `optional`: `DIGEST_MODE_UNSPECIFIED` already means "the client did not
  // send one", which is the distinction this PATCH depends on — a request that
  // omits `digest` must not reset a digest the user chose.
  DigestMode digest = 4;
}

// The ticket an outbound notification was about, found by its `Message-ID`.
// The `In-Reply-To` fallback.
//
// **A two-hop join, and both hops are here**: `notification_deliveries`
// carries the provider's `Message-ID`, and the `notifications` row it belongs
// to carries the ticket in `resource_type`/`resource_id`. Neither table exists
// in ticket-service, which is why this is one RPC rather than one column.
message ResolveTicketByMessageIdRequest {
  // The `In-Reply-To` (or a `References` entry) the sender's client echoed back.
  string provider_message_id = 1;
  // **Scoped, and not in the doc's sketch.** Without it, a `Message-ID` lifted
  // from one tenant's notification would resolve to that tenant's ticket while
  // the mail was addressed to another — the same cross-tenant misroute the
  // reply token's MAC is bound to the tenant to prevent.
  string organization_id = 2;
}

message ResolveTicketByMessageIdResponse {
  // Absent when nothing matches, which is the common case: most inbound mail
  // is not a reply to anything this system sent.
  optional string ticket_id = 1;
}

service NotificationService {
  rpc ResolveTicketByMessageId(ResolveTicketByMessageIdRequest) returns (ResolveTicketByMessageIdResponse);

  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc GetUnreadCount(ListNotificationsRequest) returns (UnreadCountResponse);

  rpc MarkRead(NotificationIdRequest) returns (MarkReadResponse);
  rpc Archive(NotificationIdRequest) returns (MarkReadResponse);
  rpc MarkManyRead(MarkReadRequest) returns (MarkReadResponse);

  rpc ListPreferences(ListPreferencesRequest) returns (ListPreferencesResponse);
  rpc UpdatePreference(UpdatePreferenceRequest) returns (PreferenceResponse);
}
