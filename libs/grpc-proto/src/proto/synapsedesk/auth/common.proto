syntax = "proto3";

package synapsedesk.auth;

import "google/protobuf/timestamp.proto";

// Types shared by more than one service in this package.
//
// Split out so `user.proto`, `two-factor.proto` and `invitation.proto` can each
// return a UserResponse without redefining it -- protobuf has no way to merge
// two definitions of one message name, so a copy would be a silent divergence
// waiting to happen the first time a field is added to only one of them.

// In Proto3, the first enum value must be 0 and serves as the default.
//
// Values are prefixed with the enum name because protobuf enum values use C++
// scoping: they are SIBLINGS of their type, not children. A bare `UNSPECIFIED`
// here would make `InvitationStatus.UNSPECIFIED` in this same package a hard
// compile error ("already defined"), not a style complaint.
enum Gender {
  GENDER_UNSPECIFIED = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
  GENDER_OTHER = 3;
}

// The tenant lifecycle, mirroring `OrgStatus` in `@synapsedesk/common`.
//
// An ENUM rather than the string it used to be, per conventions §7.3: the wire
// format rejects an unknown value before any handler runs, which is a stronger
// gate than a runtime check that somebody has to remember to write. It was the
// last enumerated domain crossing this package as a bare string.
enum OrgStatus {
  ORG_STATUS_UNSPECIFIED = 0;
  ORG_STATUS_PENDING_ONBOARDING = 1;
  ORG_STATUS_ACTIVE = 2;
  ORG_STATUS_SUSPENDED_PAST_DUE = 3;
  ORG_STATUS_FROZEN = 4;
}

// The AI tier a plan grants, mirroring `AiModelTier` in
// `@synapsedesk/common`.
//
// Two values, because two is a decision a customer makes in five seconds and
// three is a comparison table.
enum AiModelTier {
  AI_MODEL_TIER_UNSPECIFIED = 0;
  AI_MODEL_TIER_FAST = 1;
  AI_MODEL_TIER_QUALITY = 2;
}

// Only use 'optional' on primitive scalar fields because google.protobuf fields are always optional by default
message UserResponse {
  string id = 1;
  optional string organization_id = 2;
  string full_name = 3;
  optional string avatar_url = 4;
  string email = 5;
  bool is_email_verified = 6;
  optional string phone_number = 7;
  bool is_phone_verified = 8;
  // ISO 'YYYY-MM-DD', NOT a Timestamp: the column is `@db.Date` (date-only,
  // no time, no zone). Carrying it as an absolute instant would let a birthday
  // shift a day depending on the server's UTC offset.
  optional string dob = 9;
  Gender gender = 10;
  optional google.protobuf.Timestamp last_login_at = 11;
  bool is_locked = 12;
  bool is_two_factor_enabled = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  // When a temporary lock lapses; absent means INDEFINITE.
  //
  // `is_locked` stays the authoritative boolean a client should render on. This
  // is here so an admin screen can say "locked until Friday" rather than just
  // "locked", and so an expiry is visible before it fires.
  optional google.protobuf.Timestamp locked_until = 16;
}

// Shared by every list RPC in the package. Mirrors SearchPaginationBase at the
// REST edge so the gateway hands its query DTO straight through.
message PageRequest {
  // 1-based, matching the REST contract. Page 0 is a client bug and is rejected,
  // not silently coerced -- a silent coercion means the caller keeps sending it.
  int32 page = 1;
  int32 limit = 2;

  // Empty means "no filter". proto3 has no null for scalars, and `optional`
  // would only add a presence bit that says nothing an empty string does not.
  string search_term = 3;

  // Validated against a per-module allowlist in the SERVICE, never passed
  // through to `orderBy` as received -- an arbitrary column name there either
  // throws a Prisma validation error or sorts by something never meant to be
  // exposed.
  string sort_by = 4;

  // An enum, unlike sort_by, because the legal values are FIXED and knowable
  // here. Sortable columns differ per module -- users sort by lastLoginAt,
  // departments do not -- so no enum in this shared file could enumerate them,
  // which is why that field stays a string and is allowlisted per service.
  // Direction has exactly two values for every list in the system, so protoc
  // can make an illegal one unrepresentable and nothing needs to validate it.
  SortOrder sort_order = 5;
}

enum SortOrder {
  // proto3 requires a 0 member. Here it means "the caller did not choose",
  // which takes the default rather than being rejected -- direction is a
  // presentation preference, not something a request is wrong without.
  SORT_ORDER_UNSPECIFIED = 0;
  SORT_ORDER_ASC = 1;
  SORT_ORDER_DESC = 2;
}

// Field names deliberately match PaginationMetaDataResponseBase at the REST
// edge, so the gateway mapper is a rename-free copy.
message PageMeta {
  int32 total_items = 1;
  int32 item_count = 2;
  int32 items_per_page = 3;
  int32 total_pages = 4;
  int32 current_page = 5;
}
