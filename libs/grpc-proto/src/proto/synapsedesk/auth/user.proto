syntax = "proto3";

package synapsedesk.auth;

import "google/protobuf/timestamp.proto";
import "synapsedesk/auth/common.proto";

// Profiles: the caller's own, and tenant administration of everyone else's.
//
// No message carries an organization id. The tenant travels in the verified
// caller context, so there is no request in which an admin can name someone
// else's workspace.

message GetCurrentUserRequest {
  string user_id = 1;
}

message CurrentUserResponse {
  UserResponse user = 1;
  repeated string permission_codes = 2;
  repeated string department_ids = 3;
}

// ---------------------------------------------------------------------------
// Own profile
// ---------------------------------------------------------------------------

// Deliberately NARROW. `email`, `phone_number` and `is_email_verified` are
// absent because those change through the OTP flow that already exists, and
// `is_locked` / roles / departments are administrative. A field added here is a
// field a user can set about themselves -- which is the whole security question
// this message answers.
//
// **`avatar_url` is absent and must stay absent.** A settable string here would
// bypass presign -> upload -> confirm entirely: it proves nothing about whether
// the object exists or belongs to the caller, emits no USER_AVATAR_UPDATED, and
// supersedes no previous object, which then leaks in the bucket forever.
// `ConfirmAvatarUpload` and `DeleteAvatar` are the only writers of
// `users.avatar_url`, and `users.service.ts` has exactly those two.
message UpdateOwnProfileRequest {
  optional string full_name = 1;
  // ISO 'YYYY-MM-DD'. Empty string clears it; absent leaves it unchanged.
  optional string dob = 2;
  optional Gender gender = 3;
}

// ---------------------------------------------------------------------------
// Administration
// ---------------------------------------------------------------------------

message UserSummaryResponse {
  UserResponse user = 1;
  repeated string role_ids = 2;
  repeated string role_names = 3;
  repeated string department_ids = 4;

  // Populated only on soft-deleted rows, so a list including them renders
  // differently rather than showing a deactivated user as live.
  optional google.protobuf.Timestamp deleted_at = 5;
  optional string deleted_by_name = 6;
}

// Who should receive a notification addressed by PERMISSION.
//
// The producer of an in-app notification does not know who holds
// `organization.update` in a tenant — that is auth-service's answer, and
// resolving it at the producer would mean a cross-service read on a path that
// is deliberately fire-and-forget. So the producer names the permission and
// notification-service asks this.
message ListPermissionHoldersRequest {
  string organization_id = 1;
  // A `target.action` code from the canonical registry.
  string permission_code = 2;
  // Narrows the audience to one DEPARTMENT.
  //
  // Absent means the whole tenant, which is right for a quota alert (an
  // organization has one budget) and wrong for a ticket escalation: paging
  // every agent in the company for one department's queue is the noise that
  // makes people stop reading notifications.
  optional string department_id = 3;
}

// A notification recipient, with everything needed to DECIDE about them.
//
// The quiet-hours fields ride along on this read rather than needing a second
// one: notification-service already asks auth-service who the
// recipients are, and an extra round trip per notification to learn whether it
// is 3am for them would put a cross-service read on the fan-out path.
//
// They are GLOBAL user settings rather than per-type, which is why they live on
// `users` and not in `notification_preferences`.
message NotificationRecipient {
  string user_id = 1;
  string email = 2;
  string full_name = 3;

  // "22:00" / "07:00", local to `timezone`. Both absent = no quiet hours.
  optional string quiet_hours_start = 4;
  optional string quiet_hours_end = 5;
  // An IANA name — "Asia/Ho_Chi_Minh". Defaults to UTC when unset, which is
  // wrong for the user and at least deterministic.
  optional string timezone = 6;
}

message ListPermissionHoldersResponse { repeated NotificationRecipient items = 1; }

// The OTHER audience kind.
//
// A ticket event already knows who the assignee is. Resolving `ticket.read`
// holders instead would notify every agent in the tenant that one of them got
// a ticket, which is the bug the audience union exists to prevent. This read
// exists only to turn ids into addresses and quiet-hours settings.
//
// Scoped by organization as well as by id: a caller that supplied an id from
// another tenant must get nothing back, not a lookup that happens to succeed.
message ListUsersByIdsRequest {
  string organization_id = 1;
  repeated string user_ids = 2;

  // **Include locked and soft-deleted users**.
  //
  // Two callers, two different questions:
  //
  //   - notification audience: *"who can act on this?"* — exclude them
  //   - GraphQL loader:        *"who IS this?"* — include them, with state
  //
  // A ticket assigned to someone who was locked this morning must still render
  // their name; omitting them makes the assignee silently null and the UI shows
  // a blank where "Former employee" belongs.
  //
  // A FLAG rather than a second RPC: one query, one tenant check, one place to
  // get scoping wrong. Defaults false, so the existing caller is unchanged.
  bool include_inactive = 3;

  // Which shape to return.
  //
  // The notification projection carries `email`, `quiet_hours_*` and `timezone`.
  // Quiet hours are meaningless to a loader, and **`email` is precisely what
  // `UserSummary` must not expose**. Sending it anyway would make
  // the gateway hold, on every batch, forever, a field it is obliged to discard
  // — and "we fetch it and drop it" is one careless mapper away from a leak.
  UserProjection projection = 4;
}

enum UserProjection {
  // The default keeps the existing caller working with no change at its call site.
  USER_PROJECTION_NOTIFICATION = 0;
  USER_PROJECTION_SUMMARY = 1;
}

// What a GraphQL edge is allowed to see.
//
// A type reached by TRAVERSAL exposes only what the traversal's own permission
// justifies. `Ticket.assignee` is reachable with ticket access alone, so it
// carries a name and an avatar and nothing that would need `user.read`.
message UserSummary {
  string user_id = 1;
  string full_name = 2;
  optional string avatar_url = 3;
  // State, so the caller can render "Former employee" rather than infer it from
  // an absence it cannot distinguish from a missing row.
  bool is_locked = 4;
  optional google.protobuf.Timestamp deleted_at = 5;
}

// **Exactly one of these is populated**, per the request's `projection`. Two
// fields rather than a `oneof` because a `oneof` of two repeated fields needs a
// wrapper message on each side for nothing.
message ListUsersByIdsResponse {
  repeated NotificationRecipient items = 1;
  repeated UserSummary summaries = 2;
}

message ListUsersRequest {
  PageRequest page = 1;

  optional string department_id = 2;
  optional string role_id = 3;
  optional bool is_locked = 4;

  // Honoured only when the caller holds user.delete -- checked at the gateway.
  bool include_deleted = 5;
}

message ListUsersResponse {
  repeated UserSummaryResponse items = 1;
  PageMeta meta = 2;
}

message UserIdRequest {
  string id = 1;
}

message GetUserPermissionsResponse {
  // The flattened union across the user's roles -- computed by the SAME
  // function that builds the JWT claim, so the token and this endpoint cannot
  // disagree.
  repeated string permission_codes = 1;
}

message CreateUserRequest {
  string email = 1;
  string full_name = 2;
  repeated string role_ids = 3;
  repeated string department_ids = 4;
  optional string primary_department_id = 5;
}

message CreateUserResponse {
  UserSummaryResponse user = 1;
}

// Same narrowing rule as UpdateOwnProfileRequest, and for the same reason:
// `email` is tenant-unique and needs re-verification, `is_email_verified` is
// what OTP is for, and `is_super_admin` is paired with organization_id by a
// CHECK constraint that flipping it here would violate.
//
// **`avatar_url` is absent here too**, and the argument on
// UpdateOwnProfileRequest applies with a wider blast radius: an administrator
// setting another user's avatar to an arbitrary string is the same bypass aimed
// at somebody else's profile.
message UpdateUserRequest {
  string id = 1;
  optional string full_name = 2;
  optional string phone_number = 3;
  optional string dob = 4;
  optional Gender gender = 5;
}

message DeleteUserResponse {
  // Sessions destroyed alongside the deactivation. Surfaced so the UI can say
  // "signed out of N devices" rather than leaving it implicit.
  int32 revoked_session_count = 1;
}

message LockUserRequest {
  string id = 1;
  // Stored in the audit metadata and quoted in the email to the user. Required:
  // "why is this account locked?" is asked months later, by someone else.
  string reason = 2;
  // **Absent means INDEFINITE** -- the existing behaviour, unchanged. Supplied, it must be in the FUTURE: a past value would lock and
  // instantly unlock, which the database accepts and nobody understands. The
  // gateway rejects that; this service re-checks, because the gateway is not
  // the only possible caller.
  optional google.protobuf.Timestamp locked_until = 3;
}

message LockUserResponse {
  int32 revoked_session_count = 1;
}

message UnlockUserResponse {}

message ResetUserTwoFactorResponse {
  int32 untrusted_device_count = 1;
}

// REPLACE semantics -- safe to retry, unlike an append.
message SetUserRolesRequest {
  string id = 1;
  repeated string role_ids = 2;
}

message DepartmentAssignment {
  string department_id = 1;
  bool is_primary = 2;
}

message SetUserDepartmentsRequest {
  string id = 1;
  // Exactly ONE must be primary when the list is non-empty. Zero is as invalid
  // as two: the partial unique index only catches the "two" case.
  repeated DepartmentAssignment departments = 2;
}

message PresignAvatarUploadRequest {
  string content_type = 1;
  int64 size_bytes = 2;
  string original_file_name = 3;
}

message PresignAvatarUploadResponse {
  string upload_url = 1;
  string object_path = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message ConfirmAvatarUploadRequest { string object_path = 1; }

message DeleteAvatarRequest {}

// ---------------------------------------------------------------- inbound mail

// Resolve the SENDER of an inbound email, within an already-known tenant.
//
//
// **The `organization_id` is what makes this safe, and it is the whole design.**
// Self-signup answers the same policy question — "may this address join
// automatically?" — but its implementation has a second branch: no domain match
// CREATES an organization and makes the registrant its Org Admin. Reached from
// inbound mail, that turns an email from an unrecognized domain into a new
// tenant owned by a stranger.
//
// This RPC receives the tenant, so there is no branch in which it can mint one.
// It implements the domain-match half ONLY.
message ResolveInboundSenderRequest {
  // From the recipient address's token — NEVER from the sender's domain.
  //
  // The global `findFirst(allowedEmailDomains has domain)` self-signup uses
  // answers a different question — "which tenant claims this domain?" — and
  // would provision a sender into whichever tenant matched, while their mail
  // was addressed to yours.
  string organization_id = 1;
  string email = 2;
  // From the `From` header. `users.full_name` is NOT NULL, so the local part is
  // the fallback — the same stand-in the Google sign-in path uses.
  optional string display_name = 3;
}

message ResolveInboundSenderResponse {
  // ABSENT means the sender may not author in this tenant: not a member, and
  // their domain is not in this tenant's `allowed_email_domains`. The caller
  // drops the mail and sends one auto-reply.
  optional string user_id = 1;
  // True when this call provisioned the account, so the caller can log a
  // provisioning event rather than inferring one from a first-seen author.
  bool created = 2;
}

service UserService {
  // Unauthenticated by design — the caller is the inbound-email webhook, which
  // holds a verified Worker signature and no user context. It cannot name a
  // role, and it cannot reach the founder branch: see the request message.
  rpc ResolveInboundSender(ResolveInboundSenderRequest) returns (ResolveInboundSenderResponse);

  rpc GetCurrentUser(GetCurrentUserRequest) returns (CurrentUserResponse);
  rpc UpdateOwnProfile(UpdateOwnProfileRequest) returns (UserResponse);

  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc GetUser(UserIdRequest) returns (UserSummaryResponse);
  rpc GetUserPermissions(UserIdRequest) returns (GetUserPermissionsResponse);

  // Service-to-service only: notification-service resolves an audience from a
  // permission code. Never routed by the gateway — it enumerates a tenant's
  // users and their addresses, which no client has business asking for.
  rpc ListPermissionHolders(ListPermissionHoldersRequest) returns (ListPermissionHoldersResponse);
  rpc ListUsersByIds(ListUsersByIdsRequest) returns (ListUsersByIdsResponse);

  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UserSummaryResponse);
  rpc DeleteUser(UserIdRequest) returns (DeleteUserResponse);
  rpc RestoreUser(UserIdRequest) returns (UserSummaryResponse);
  rpc LockUser(LockUserRequest) returns (LockUserResponse);
  rpc UnlockUser(UserIdRequest) returns (UnlockUserResponse);
  rpc ResetUserTwoFactor(UserIdRequest) returns (ResetUserTwoFactorResponse);

  // Avatars. auth-service owns `users.avatar_url`,
  // so it initiates the upload and calls storage-service internally; the
  // gateway never talks to storage-service directly.
  rpc PresignAvatarUpload(PresignAvatarUploadRequest) returns (PresignAvatarUploadResponse);
  rpc ConfirmAvatarUpload(ConfirmAvatarUploadRequest) returns (UserResponse);
  rpc DeleteAvatar(DeleteAvatarRequest) returns (UserResponse);

  rpc SetUserRoles(SetUserRolesRequest) returns (UserSummaryResponse);
  rpc SetUserDepartments(SetUserDepartmentsRequest) returns (UserSummaryResponse);
}
