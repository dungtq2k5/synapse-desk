syntax = "proto3";

package synapsedesk.auth;

import "google/protobuf/timestamp.proto";
import "synapsedesk/auth/common.proto";

// The caller's OWN tenant. Every RPC here resolves the organization from the
// verified caller context -- there is no id field anywhere in this file, so
// there is no request in which a tenant admin can name someone else's
// workspace. Cross-tenant reads belong to the platform API.

message OrganizationResponse {
  string id = 1;
  string name = 2;
  string slug = 3;
  optional string domain = 4;

  OrgStatus status = 5;

  bool enforce_two_factor = 6;
  repeated string allowed_email_domains = 7;

  int32 max_agent_seats = 8;
  // int64 on the wire; both are byte counts that exceed 2^31 on any real plan.
  int64 max_storage_bytes = 9;
  int64 monthly_ai_token_budget = 10;
  // Read by `ingestion-service`'s settings layer so it can resolve a
  // generation model without a Postgres reach-across, and cached there against
  // `billing.entitlements_changed` — doc 15 §3.1.
  AiModelTier ai_model_tier = 14;
  google.protobuf.Timestamp billing_cycle_start = 11;

  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message GetCurrentOrganizationRequest {}

/**
 * The tenant lifecycle gate's lookup. Deliberately TINY and by-id.
 *
 * It runs on essentially every authenticated request, so it must not be
 * `GetCurrentOrganization` — that returns quotas, domains and timestamps the
 * gate never reads, and the gateway would pay to serialize all of it a few
 * hundred times a second. The gateway caches the answer, so this is cheap even
 * before the cache.
 */
message GetOrganizationStatusRequest {
  string organization_id = 1;
}

message OrganizationStatusResponse {
  OrgStatus status = 1;
  // True once the tenant has been offboarded. Distinct from any status: a
  // deleted tenant must be refused even if its status still reads ACTIVE.
  bool deleted = 2;
}

// Absent means "leave unchanged" for all three.
message UpdateOrganizationRequest {
  optional string name = 1;
  optional string slug = 2;
  // Empty string clears it.
  optional string domain = 3;
}

message OrganizationSettingsResponse {
  bool enforce_two_factor = 1;
  repeated string allowed_email_domains = 2;

  // Free-mail domains that were ACCEPTED but are worth a second look: anyone
  // holding such an address could then auto-join the tenant. Reported rather
  // than rejected, because no blocklist of these can be exhaustive -- so the
  // useful thing is to tell the admin, not to pretend we caught them all.
  repeated string public_domain_warnings = 3;
}

message GetOrganizationSettingsRequest {}

message UpdateOrganizationSettingsRequest {
  optional bool enforce_two_factor = 1;

  // REPLACE semantics. These decide WHO CAN AUTO-JOIN the tenant at
  // registration, so this is a security setting rather than a preference --
  // adding a free-mail domain here would let anyone with such an address in.
  repeated string allowed_email_domains = 2;
  // Distinguishes "leave the list alone" from "clear it": a repeated field
  // cannot express absence on its own, so without this an update that only
  // touches enforce_two_factor would wipe the domains.
  bool replace_allowed_email_domains = 3;
}

// ---------------------------------------------------------------------------
// Usage
// ---------------------------------------------------------------------------

/**
 * One meter. `available` is false for meters whose owning domain does not exist
 * yet, and the numbers are then unset -- deliberately NOT zero, which would
 * read as "no usage" rather than "unknown".
 */
message UsageMeter {
  bool available = 1;
  optional int64 used = 2;
  optional int64 limit = 3;
  // Why it is unavailable, for the UI to show in place of a number.
  optional string unavailable_reason = 4;
}

message GetOrganizationUsageRequest {}

// Everything a spending service needs to gate a request, in ONE call.
//
// `ingestion-service` and `rag-service` both need the tier AND the quota
// columns, and neither may reach into postgres_auth to get them (RDM §1.13).
// A dedicated message rather than reusing `OrganizationResponse` because the
// callers are on the HOT PATH of every AI request: shipping them a tenant's
// name, slug, allowed email domains and onboarding state on every gate check
// is bytes nobody reads, and it invites a caller to start depending on a field
// that has nothing to do with entitlements.
message OrganizationEntitlementsResponse {
  int32 max_agent_seats = 1;
  int64 max_storage_bytes = 2;
  // MICROS of currency, not tokens — RDM §1.14. The name is kept for continuity.
  int64 monthly_ai_token_budget = 3;
  AiModelTier ai_model_tier = 4;
  // The quota window. Its EPOCH is inside the Redis counter key, so a caller
  // that read a different value from this one would meter into a key nothing
  // else reads.
  google.protobuf.Timestamp billing_cycle_start = 5;
  // Carried so a caller can refuse a request from a tenant whose lifecycle
  // already forbids it, without a second round trip.
  OrgStatus status = 6;
}

message GetOrganizationEntitlementsRequest {}

// Tenant timezones, in BULK — 19-doc §2.2.
//
// The daily rollup jobs bucket by the tenant's local date, and they run across
// every tenant that had activity rather than on behalf of one caller. So this
// takes ids as a FIELD (there is no actor) and answers many at once: one round
// trip per run rather than one per tenant.
//
// Service-to-service only. It is never routed by the gateway — a tenant's
// timezone is not a secret, but a bulk read keyed by ids from outside is a
// shape no client should have.
message ListOrganizationTimezonesRequest {
  repeated string organization_ids = 1;
}

message OrganizationTimezone {
  string organization_id = 1;
  // An IANA name. Absent means the tenant has not set one; the caller uses UTC.
  optional string timezone = 2;
}

message ListOrganizationTimezonesResponse {
  repeated OrganizationTimezone items = 1;
}

// Every tenant's BILLING CYCLE START, in bulk -- 20-doc §3.1.
//
// Exists because quota reconciliation is per tenant and the cycle start differs
// per tenant. The job it serves previously took ONE cycle start and applied it
// to everybody, which wrote each tenant's corrected counter under a Redis key
// the gate never reads -- reconciliation that appeared to succeed and corrected
// nothing.
//
// Bulk for the same reason as the timezone read above: one round trip per
// reconciliation sweep rather than one per tenant.
message ListOrganizationCyclesRequest {
  repeated string organization_ids = 1;
}

message OrganizationCycle {
  string organization_id = 1;
  // Absent when the tenant has none. The caller must NOT default this to "now"
  // or to the epoch silently -- a wrong cycle start reconciles against a key
  // nothing reads, which is the bug this message was added to fix.
  optional google.protobuf.Timestamp billing_cycle_start = 2;
}

message ListOrganizationCyclesResponse {
  repeated OrganizationCycle items = 1;
}

message OrganizationUsageResponse {
  // Active members PLUS pending invitations -- pending invites RESERVE seats,
  // so this must match what the invitation path enforces or an invite gets
  // rejected by a counter this page says has room.
  UsageMeter seats = 1;
  UsageMeter storage = 2;
  UsageMeter ai_tokens = 3;
  google.protobuf.Timestamp billing_cycle_start = 4;

  // Added by doc 15 §3.1: this becomes the page a customer opens when they hit
  // a limit, so it has to say what they are ON as well as what they have used.
  //
  // A limit with no plan beside it is a number the reader cannot act on — the
  // next question is always "what would I get if I upgraded", and answering it
  // elsewhere means a second page load at the exact moment someone is blocked.
  AiModelTier ai_model_tier = 5;
  string plan_name = 6;
  // Absent for a grandfathered tenant, who has no invoice period at all.
  optional google.protobuf.Timestamp current_period_end = 7;
}

// ---------------------------------------------------------------------------
// Onboarding & offboarding
// ---------------------------------------------------------------------------

message OnboardingStep {
  string key = 1;
  string label = 2;
  bool complete = 3;
}

message GetOnboardingRequest {}

message OnboardingResponse {
  // Derived LIVE from the data, never stored. A stored checklist drifts from
  // reality the moment someone deletes the department they created.
  repeated OnboardingStep steps = 1;
  bool can_complete = 2;
  OrgStatus status = 3;
}

message CompleteOnboardingRequest {}

message DeleteOrganizationRequest {
  // Recorded in the audit trail. Offboarding is not self-service-final: a
  // Super Admin finalises it, and they will want to know why.
  string reason = 1;
}

message DeleteOrganizationResponse {
  int32 revoked_session_count = 1;
}

// ---------------------------------------------------------------- inbound mail

// Resolve the tenant from the token in an inbound support address — 31-doc §2.
message ResolveOrgByInboundTokenRequest {
  string inbound_token = 1;
}

message ResolveOrgByInboundTokenResponse {
  // ABSENT means the address is definitively unroutable: no such token, or a
  // deleted tenant. The caller drops the mail and answers 200.
  //
  // Optional rather than a NOT_FOUND error on purpose. An exception cannot be
  // told apart from auth-service being unreachable, and the two need opposite
  // answers: an unroutable address must be dropped (200, no retry), while an
  // infrastructure failure must NOT be, or the mail is lost on the one retry
  // that would have recovered it.
  optional string organization_id = 1;

  // The tenant's lifecycle state, so the caller can distinguish "no such
  // tenant" from "suspended" in its logs rather than reporting both as a drop.
  OrgStatus status = 2;
}

// The tenant's inbound token, BY tenant — the reverse of the lookup above.
//
// notification-service needs it to build the `Reply-To` that makes an emailed
// notification answerable (31-doc §4). Absent means the tenant has inbound
// email switched off, which is the default.
message GetInboundTokenRequest { string organization_id = 1; }
message GetInboundTokenResponse { optional string inbound_token = 1; }

// Issue or ROTATE the tenant's inbound-mail token — 31-doc §2.
//
// One message for both, because "enable" and "rotate" differ only in whether
// the row already had a value — and rotation is one of the three properties
// §2 chose an opaque token for: an abused address can be replaced without
// touching anything else.
//
// No `organization_id`: like every other method on this service, the tenant
// comes from the verified caller context, so there is no request shape in
// which an admin could re-key someone else's workspace.
message IssueInboundTokenRequest {}
message IssueInboundTokenResponse { string inbound_token = 1; }

// Switch inbound mail off without deleting the tenant — 31-doc §2. Sets NULL,
// which is the state a tenant that never enabled email is already in.
message RevokeInboundTokenRequest {}
message RevokeInboundTokenResponse {}

service OrganizationService {
  rpc GetInboundToken(GetInboundTokenRequest) returns (GetInboundTokenResponse);
  rpc IssueInboundToken(IssueInboundTokenRequest) returns (IssueInboundTokenResponse);
  rpc RevokeInboundToken(RevokeInboundTokenRequest) returns (RevokeInboundTokenResponse);

  // Unauthenticated by design: the caller is the inbound-email webhook, which
  // has no user context — it holds a verified Worker signature instead. The
  // token IS the lookup key, and it grants nothing beyond naming a tenant.
  rpc ResolveOrgByInboundToken(ResolveOrgByInboundTokenRequest) returns (ResolveOrgByInboundTokenResponse);

  rpc GetCurrentOrganization(GetCurrentOrganizationRequest) returns (OrganizationResponse);
  rpc GetOrganizationStatus(GetOrganizationStatusRequest) returns (OrganizationStatusResponse);
  rpc UpdateOrganization(UpdateOrganizationRequest) returns (OrganizationResponse);

  rpc GetOrganizationSettings(GetOrganizationSettingsRequest) returns (OrganizationSettingsResponse);
  rpc UpdateOrganizationSettings(UpdateOrganizationSettingsRequest) returns (OrganizationSettingsResponse);

  rpc GetOrganizationUsage(GetOrganizationUsageRequest) returns (OrganizationUsageResponse);

  // Read by ingestion-service and rag-service on the AI hot path, and CACHED
  // there against `billing.entitlements_changed` (doc 15 §1.3) — so this is a
  // cache fill rather than a per-request call.
  rpc GetOrganizationEntitlements(GetOrganizationEntitlementsRequest) returns (OrganizationEntitlementsResponse);
  rpc ListOrganizationTimezones(ListOrganizationTimezonesRequest) returns (ListOrganizationTimezonesResponse);
  rpc ListOrganizationCycles(ListOrganizationCyclesRequest) returns (ListOrganizationCyclesResponse);

  rpc GetOnboarding(GetOnboardingRequest) returns (OnboardingResponse);
  rpc CompleteOnboarding(CompleteOnboardingRequest) returns (OrganizationResponse);

  rpc DeleteOrganization(DeleteOrganizationRequest) returns (DeleteOrganizationResponse);
}
