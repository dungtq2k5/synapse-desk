syntax = "proto3";

package synapsedesk.auth;

import "google/protobuf/timestamp.proto";
import "synapsedesk/auth/common.proto";

// Roles and the permission catalogue.
//
// A tenant sees its OWN roles plus the global system roles
// (`organization_id IS NULL`). That union is the point: SUPPORT_AGENT must be
// assignable in every tenant without each one redefining it.

message RoleResponse {
  string id = 1;
  string name = 2;
  optional string description = 3;

  // True for a GLOBAL role: readable by every tenant, mutable by none. The
  // gateway uses it to grey out edit controls; the service enforces it.
  bool is_system_role = 4;

  // Denormalized counter on `roles.user_assigned`, maintained in the same
  // transaction as every junction write. It is a CACHE -- authoritative enough
  // to gate deletion, not authoritative enough to be the only copy.
  int32 user_assigned = 5;

  // Deliberately a bare `string[]`, with NO retired marker.
  //
  // A role can hold a retired code, and this is the other half of the editor
  // that would show it indistinguishably. Left as codes because the editor's
  // other request is `GET /permissions`, which now carries `is_retired` — so
  // marking a role's codes is a set lookup on data the client already has,
  // rather than a second derivation that could disagree with the first
  // (ADR 0038).
  repeated string permission_codes = 6;

  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message ListRolesRequest {
  PageRequest page = 1;

  // When false the response carries tenant roles only. Default (proto3 zero) is
  // false, so a caller that wants the assignable set must ask for it -- which
  // is the safer direction than silently widening a list.
  bool include_system = 2;
}

message ListRolesResponse {
  repeated RoleResponse items = 1;
  PageMeta meta = 2;
}

message RoleIdRequest {
  string id = 1;
}

message CreateRoleRequest {
  string name = 1;
  optional string description = 2;
  // Applied at creation so a role is never briefly live with no permissions.
  repeated string permission_codes = 3;
}

message UpdateRoleRequest {
  string id = 1;
  // Absent means "leave unchanged"; empty description means "clear it".
  optional string name = 2;
  optional string description = 3;
}

message DeleteRoleResponse {}

// REPLACE semantics, which is what makes it safe to retry: sending the same set
// twice is a no-op rather than a double grant.
message SetRolePermissionsRequest {
  string id = 1;
  repeated string permission_codes = 2;
}

// ---------------------------------------------------------------- Permission catalogue

message PermissionResponse {
  string id = 1;
  string code = 2;
  string name = 3;
  // The `target` prefix of the code ('user' from 'user.read'). Derived, not
  // stored -- it is what makes the role editor groupable without a new column.
  string group = 4;
  // True when this row is in the TABLE and not in `PERMISSION_CODES`.
  //
  // Codes never mutate but they do RETIRE: one removed from the array is left
  // in the table on purpose, because tenant custom roles may still reference it
  // and dropping the row would cascade that grant away silently (ADR 0038). So
  // the catalogue can legitimately hold rows the union does not, and without
  // this the role editor offers them beside live ones -- `assertGrantable` then
  // refuses the write, correctly, and it reads as a bug because the UI offered
  // it.
  //
  // Derived at read time, never stored: the same shape as `group` above, and
  // for the same reason -- a column could disagree with the array.
  bool is_retired = 5;
}

message ListPermissionsRequest {}

message ListPermissionsResponse {
  repeated PermissionResponse items = 1;
}

// Bulk-assign one role, leaving each user's other roles alone. The inverse
// direction of SetUserRoles, which replaces a whole set for one user.
message AssignRoleUsersRequest {
  string role_id = 1;
  repeated string user_ids = 2;
}

message RevokeRoleUserRequest {
  string role_id = 1;
  string user_id = 2;
}

service RoleService {
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc GetRole(RoleIdRequest) returns (RoleResponse);
  rpc CreateRole(CreateRoleRequest) returns (RoleResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (RoleResponse);
  rpc DeleteRole(RoleIdRequest) returns (DeleteRoleResponse);
  rpc SetRolePermissions(SetRolePermissionsRequest) returns (RoleResponse);
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse);

  // Both return the ROLE rather than a count: `user_assigned` is the number the
  // caller's screen is showing and the one this just changed. A bare
  // `{ assigned: n }` would leave the client guessing whether its total is
  // still right — and for a bulk that partially no-ops, comparing the returned
  // counter is the only way to learn how many were actually new.
  rpc AssignRoleUsers(AssignRoleUsersRequest) returns (RoleResponse);
  rpc RevokeRoleUser(RevokeRoleUserRequest) returns (RoleResponse);
}
