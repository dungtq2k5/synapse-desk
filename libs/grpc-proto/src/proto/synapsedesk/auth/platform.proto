syntax = "proto3";

package synapsedesk.auth;

import "google/protobuf/timestamp.proto";
import "synapsedesk/auth/common.proto";
import "synapsedesk/auth/organization.proto";
import "synapsedesk/auth/role.proto";

// Platform administration (RDM).
//
// Every RPC here reads or writes ACROSS tenants, which is exactly why it is a
// separate service rather than extra methods on the tenant-facing ones: the
// tenant services apply `tenantScope` unconditionally, and a cross-tenant
// method living beside them would be one forgotten filter away from leaking.
// The gateway gates the whole surface with SuperAdminGuard.

message PlatformOrganizationResponse {
  OrganizationResponse organization = 1;

  // Rollups, so the tenant list is useful without N follow-up calls.
  int32 user_count = 2;
  int32 pending_invitation_count = 3;
  int32 department_count = 4;

  optional google.protobuf.Timestamp deleted_at = 5;
}

message ListPlatformOrganizationsRequest {
  PageRequest page = 1;
  // Absent means "every status"; the enum's UNSPECIFIED is not used as a
  // filter value, so presence is explicit.
  optional OrgStatus status = 2;
  bool include_deleted = 3;
}

message ListPlatformOrganizationsResponse {
  repeated PlatformOrganizationResponse items = 1;
  PageMeta meta = 2;
}

message PlatformOrganizationIdRequest {
  string organization_id = 1;
}

/**
 * Creates a tenant AND its first Org Admin in ONE transaction.
 *
 * Half of this is useless: an organization nobody can administer, or an admin
 * with no organization. They are created together or not at all.
 */
message CreatePlatformOrganizationRequest {
  string name = 1;
  string slug = 2;
  optional string domain = 3;
  repeated string allowed_email_domains = 4;

  // The first Org Admin. No password: the account is created without one and
  // the human sets it through the reset flow, which is also what proves they
  // hold the address.
  string admin_email = 5;
  string admin_full_name = 6;

  // Quotas. Absent takes the schema default rather than zero -- a tenant
  // created with 0 seats could never be used.
  optional int32 max_agent_seats = 7;
  optional int64 max_storage_bytes = 8;
  optional int64 monthly_ai_token_budget = 9;
}

message CreatePlatformOrganizationResponse {
  PlatformOrganizationResponse organization = 1;
  UserResponse admin = 2;
}

// Anything a Super Admin may change, INCLUDING quotas -- which is the whole
// difference from the tenant-facing update.
message UpdatePlatformOrganizationRequest {
  string organization_id = 1;
  optional string name = 2;
  optional string slug = 3;
  optional string domain = 4;
  optional int32 max_agent_seats = 5;
  optional int64 max_storage_bytes = 6;
  optional int64 monthly_ai_token_budget = 7;
}

message SetOrganizationStatusRequest {
  string organization_id = 1;
  OrgStatus status = 2;
  // Required. "Why is Acme frozen?" is asked six months later, by someone else.
  string reason = 3;
}

message ResetBillingCycleRequest {
  string organization_id = 1;
  // **Mandatory since billing shipped**. `billing_cycle_start` now
  // follows Stripe's `current_period_start` AND its epoch sits inside the Redis
  // quota key — so a manual roll both desynchronizes the quota window from the
  // invoice period and silently grants a fresh AI budget. The endpoint stays
  // because it is genuinely needed to make a tenant whole after an incident;
  // the reason is what makes it break-glass rather than routine.
  string reason = 2;
}

message OffboardOrganizationRequest {
  string organization_id = 1;
  string reason = 2;
}

message OffboardOrganizationResponse {
  int32 revoked_session_count = 1;
}

// ---------------------------------------------------------------- Cross-tenant search

message PlatformUserResponse {
  UserResponse user = 1;
  // ALWAYS present. A bare user list with no tenant column is how a support
  // engineer acts on the wrong account.
  optional string organization_id = 2;
  optional string organization_name = 3;
  repeated string role_names = 4;
  optional google.protobuf.Timestamp deleted_at = 5;
}

message ListPlatformUsersRequest {
  PageRequest page = 1;
  optional string organization_id = 2;
  bool include_deleted = 3;
}

message ListPlatformUsersResponse {
  repeated PlatformUserResponse items = 1;
  PageMeta meta = 2;
}

// ---------------------------------------------------------------- Global roles

message ListGlobalRolesRequest {
  PageRequest page = 1;
}

message ListGlobalRolesResponse {
  repeated RoleResponse items = 1;
  PageMeta meta = 2;
}

// A GLOBAL role: organization_id IS NULL, is_system_role = true. Visible to
// every tenant, which is why only the platform may mint one.
message CreateGlobalRoleRequest {
  string name = 1;
  optional string description = 2;
  repeated string permission_codes = 3;
}

// ---------------------------------------------------------------- Metrics

message GetPlatformMetricsRequest {}

// Job health. auth-service's two scheduled jobs, since it moved
// off `@nestjs/schedule`: the heartbeat table lives in each service's own
// database, so `/platform/jobs` is a three-leg fan-out.
message AuthJobHealthRequest {}

message AuthJobRunStatus {
  string job_name = 1;
  optional google.protobuf.Timestamp last_started_at = 2;
  // Preserved across a failure -- this is what the staleness check reads.
  optional google.protobuf.Timestamp last_succeeded_at = 3;
  optional int32 last_duration_ms = 4;
  optional string last_error = 5;
  int32 consecutive_failures = 6;
}

message AuthJobHealthResponse {
  repeated AuthJobRunStatus items = 1;
}

message PlatformMetricsResponse {
  int32 total_organizations = 1;
  // Keyed by status, so a new status does not need a new field.
  map<string, int32> organizations_by_status = 2;
  int32 total_users = 3;
  int32 active_users = 4;
  int32 pending_invitations = 5;
  int32 live_sessions = 6;
  int32 seats_allocated = 7;
  int32 seats_in_use = 8;
  google.protobuf.Timestamp generated_at = 9;
}

// ---------------------------------------------------------------- Finance

message GetFinanceSnapshotRequest {}

// Tenant counts, from auth's own tables. The same definition `GetMetrics` uses
// -- `deleted_at IS NULL` -- so the two routes cannot disagree about which
// tenants exist.
message FinanceTenantCounts {
  int32 total = 1;
  // Keyed by status, for the reason `organizations_by_status` is: a new status
  // must not need a new field.
  //
  // **`ACTIVE` here is NOT `active_subscriptions` in the revenue section.** The
  // Stripe status mapping folds `trialing` into `ACTIVE`, while the revenue
  // estimate counts `status: 'active'` subscriptions only. Two populations, one
  // adjective -- named apart so they cannot be subtracted from each other.
  map<string, int32> by_status = 2;
}

message FinancePlanMix {
  string plan_id = 1;
  string plan_name = 2;

  // **Not `SubscriptionPlanResponse.subscriber_count`, and deliberately.** That
  // one is unfiltered: it counts SOFT-DELETED tenants, because `DeletePlan`
  // reads it to refuse retiring a plan somebody still points at, and an
  // offboarded tenant can be RESTORED. Finance asks a different question --
  // who is a subscriber now -- and gets `deleted_at IS NULL`.
  //
  // Three consumers, three correct answers. See `liveSubscribersByPlan`.
  int32 subscribers = 3;

  // Summed from `organizations.max_agent_seats`, never `plan.max_agent_seats x
  // subscribers`: the two diverge for every tenant with `entitlements_pinned`
  // or a manual override, which is exactly the population plan-apply does not
  // touch. This is what tenants HOLD.
  int64 seats_allocated = 4;
}

message DunningTenant {
  string id = 1;
  string name = 2;

  // **`updated_at`, and NOT "past due since".** There is no status-change
  // timestamp on `organizations` -- the column does not exist -- so the closest
  // available fact is when the row last changed, which a rename, a quota edit
  // or a webhook all move. Naming it `since` would have rendered as a dunning
  // age on a finance page, which is a confidently wrong number of exactly the
  // kind section 3a refuses for failed-payment amounts.
  google.protobuf.Timestamp updated_at = 3;
}

// **`FROZEN` is deliberately absent from this message.** Two unrelated things
// produce it: Stripe cancelling a subscription, and an operator applying a
// compliance hold through `SetOrganizationStatus` -- which exists precisely
// because it has no Stripe equivalent. A churn figure built on `FROZEN` counts
// legal holds as lost customers. Cancellations come from `billing_events`,
// where the two are distinguishable, and the frozen COUNT stays under tenancy.
message FinanceDunning {
  int32 past_due = 1;
  repeated DunningTenant tenants = 2;
}

// The revenue estimate, or why there is not one.
//
// Follows `UsageMeterResponse`'s degrade-with-a-reason shape rather than
// failing the call: a Stripe outage must cost the revenue section and nothing
// else on the page.
message FinanceRevenue {
  bool available = 1;
  optional string unavailable_reason = 2;

  // In the currency's smallest unit, as Stripe reports it. Annual prices are
  // divided by twelve.
  optional int64 estimated_mrr = 3;
  optional string currency = 4;
  optional int32 active_subscriptions = 5;

  // When the JOB read Stripe -- not when this endpoint answered. A fresh page
  // over a two-hour-old snapshot is indistinguishable from a stale page
  // without it.
  optional google.protobuf.Timestamp computed_at = 6;

  // The caveats, on the wire. See REVENUE_EXCLUSIONS.
  repeated string excludes = 7;
}

message FinanceSnapshotResponse {
  FinanceTenantCounts tenants = 1;
  repeated FinancePlanMix plans = 2;
  FinanceDunning dunning = 3;
  FinanceRevenue revenue = 4;

  // When THIS response was assembled. Distinct from `revenue.computed_at`,
  // which is the snapshot's own age.
  google.protobuf.Timestamp generated_at = 5;
}

message ListBillingEventsRequest {
  // Inclusive ISO dates. Both required: `billing_events` never shrinks, so an
  // unbounded default range is a full scan of the entire history on a page
  // load.
  string from = 1;
  string to = 2;
}

// One (day, event_type) cell.
//
// **`repeated`, not a map.** A map is unordered and single-keyed, and this is
// ordered and keyed by the pair. Same shape as `AiUsagePoint`, for the same
// reason.
message BillingEventPoint {
  string day = 1;
  // Deliberately a string - see `BillingEventPointResponseDto` for the reason.
  string event_type = 2;
  int32 count = 3;
}

message ListBillingEventsResponse {
  repeated BillingEventPoint points = 1;

  // Tenants CURRENTLY offboarded, bucketed by the day they were offboarded.
  //
  // Beside the cancellation events rather than merged into them: Stripe
  // cancelling a subscription and an operator offboarding a workspace are
  // different endings, and a series that conflates them cannot tell voluntary
  // churn from an incident.
  //
  // **Named for the state rather than the event, and that is the disclosure.**
  // It reads `organizations.deleted_at`, which `RestoreOrganization` CLEARS --
  // so restoring a tenant removes it from every past range, including months
  // already read and quoted. As `offboardings` that was an event count that
  // shrinks, which is a defect; as `currently_offboarded` it is a projection of
  // current state behaving as named.
  //
  // A stable churn series needs an append-only source --
  // `PLATFORM_ORGANIZATION_OFFBOARDED` in `audit_logs`, which lives in
  // ticket-service and would be a cross-service read this surface does not
  // have. Not built here; the name is what stops the number being read as
  // history in the meantime.
  repeated BillingEventPoint currently_offboarded = 2;

  // **The event types actually SEEN in this range**, so a type that has never
  // arrived is visibly absent rather than reported as zero.
  //
  // Which types arrive at all is decided by the Stripe endpoint's
  // `enabled_events`, and NOTHING in this repository sets it --
  // `provision-stripe.mjs` never touches `webhookEndpoints`. So "no
  // cancellations this month" and "cancellations were never enabled" render
  // identically, and this field is the only thing that separates them.
  repeated string observed_event_types = 3;
}

// ---------------------------------------------------------------- The plan catalogue
// Cross-tenant by nature: a plan is not owned by any tenant, and applying one
// writes across all of its subscribers. That is why it lives HERE rather than
// beside the tenant-facing billing RPCs.

message SubscriptionPlanPriceResponse {
  string id = 1;
  string stripe_price_id = 2;
  // `month` | `year`. A string, not an enum -- Stripe's own vocabulary, and a
  // new interval must not need a proto change.
  string interval = 3;
}

message SubscriptionPlanResponse {
  string id = 1;
  string name = 2;

  // Absent for a plan ASSIGNED rather than sold: the negotiated agreement,
  // invisible to self-service and legal on purpose. A UI must show which kind
  // a plan is, or Super Admins create catalogue entries nobody can buy.
  optional string stripe_product_id = 3;

  int32 max_agent_seats = 4;
  int64 max_storage_bytes = 5;
  int64 monthly_ai_token_budget = 6;
  AiModelTier ai_model_tier = 7;
  int64 max_document_bytes = 8;
  int64 max_attachment_bytes = 9;
  int32 max_document_uploads = 16;
  int32 max_analytics_range_days = 17;

  bool is_active = 10;
  repeated SubscriptionPlanPriceResponse prices = 11;

  // How many live tenants hold this plan. The number that decides whether a
  // delete is allowed and how large an apply's blast radius is.
  int32 subscriber_count = 12;

  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  optional google.protobuf.Timestamp deleted_at = 15;
}

message ListPlansRequest {
  PageRequest page = 1;
  bool include_inactive = 2;
  bool include_deleted = 3;
}

message ListPlansResponse {
  repeated SubscriptionPlanResponse items = 1;
  PageMeta meta = 2;
}

message PlanIdRequest { string plan_id = 1; }

// Every grant is REQUIRED on create: a plan states every limit it grants, with
// no blanks. A plan that does not differentiate on a dimension states the
// platform ceiling explicitly, which is a decision recorded rather than
// inferred.
message CreatePlanRequest {
  string name = 1;
  optional string stripe_product_id = 2;

  int32 max_agent_seats = 3;
  int64 max_storage_bytes = 4;
  int64 monthly_ai_token_budget = 5;
  AiModelTier ai_model_tier = 6;
  int64 max_document_bytes = 7;
  int64 max_attachment_bytes = 8;
  int32 max_document_uploads = 11;
  int32 max_analytics_range_days = 12;

  bool is_active = 9;
  repeated CreatePlanPriceInput prices = 10;
}

message CreatePlanPriceInput {
  string stripe_price_id = 1;
  string interval = 2;
}

// Every field OPTIONAL on update, and absent means "leave it": a PATCH that
// silently reset unmentioned grants to a proto zero would empty a catalogue row
// from a form that touched one field.
message UpdatePlanRequest {
  string plan_id = 1;

  optional string name = 2;
  optional string stripe_product_id = 3;
  bool clear_stripe_product_id = 4;

  optional int32 max_agent_seats = 5;
  optional int64 max_storage_bytes = 6;
  optional int64 monthly_ai_token_budget = 7;
  optional AiModelTier ai_model_tier = 8;
  optional int64 max_document_bytes = 9;
  optional int64 max_attachment_bytes = 10;
  optional int32 max_document_uploads = 12;
  optional int32 max_analytics_range_days = 13;

  optional bool is_active = 11;
}

// What ONE subscriber would get, and what that would mean for them.
message PlanSubscriberProjection {
  string organization_id = 1;
  string organization_name = 2;

  // Field name -> "before -> after", for the columns this apply would change.
  // A map keyed by field name so a new grant needs no new field here.
  map<string, string> changes = 3;

  // The AFTER value of every NUMERIC column in `changes`, keyed the same way.
  // `changes` is a display string and stays one; this is what a machine reads.
  // A key absent here means the column is not changing -- never "zero".
  //
  // int64 because `max_storage_bytes` is one of the keys and already exceeds
  // int32 on every plan; ts-proto renders it `number`, as it does elsewhere in
  // billing.proto. The producer holds four of these grants as Prisma `BigInt`,
  // so it coerces with `Number()` -- lossless, because every one is a byte
  // count far inside `MAX_SAFE_INTEGER`.
  //
  // known-gaps #21 is why this exists: the composer was parsing
  // `"before -> after"` and a cosmetic change to the separator silently
  // disarmed the storage and document checks while eleven e2e tests stayed
  // green.
  map<string, int64> after = 7;

  // **Already over a limit the new plan sets.** Not a blocker: a limit gates
  // ADMISSION and never TENURE, so these tenants keep
  // everything they have and are refused their NEXT addition. It is reported
  // so a Super Admin sees the blast radius rather than learning it from a
  // support ticket.
  repeated string over_limit = 4;

  // Skipped entirely: the tenant is off-catalogue by deliberate policy — a
  // Super Admin pinned their entitlements, and re-deriving from the plan is the
  // silent revert the pin exists to prevent.
  bool skipped_pinned = 5;

  // Held back to the next cycle roll rather than applied now: lowering a
  // part-spent budget mid-cycle is retroactive in effect.
  bool budget_deferred = 6;
}

message ApplyPlanRequest {
  string plan_id = 1;
  // TRUE projects and writes NOTHING. The projection is computed by the same
  // code either way -- a dry run that answered differently from the apply it
  // predicts would be worse than no dry run.
  bool dry_run = 2;
}

message ApplyPlanResponse {
  repeated PlanSubscriberProjection subscribers = 1;
  bool dry_run = 2;

  int32 changed_count = 3;
  int32 skipped_pinned_count = 4;
  int32 over_limit_count = 5;

  // Which limits the projection actually CHECKED.
  //
  // **A dimension absent from this list was not evaluated, and the counts above
  // say nothing about it.** Without it a zero `over_limit_count` is
  // indistinguishable from a working check that found nobody — which is a
  // stronger claim than "we did not look", and the one a Super Admin would act
  // on. Storage is the live case: counting it needs a platform-scoped usage
  // read that does not exist yet.
  //
  // A property of the RUN, not of each subscriber: repeating "storage unknown"
  // on all 47 rows says it 47 times and invites skimming, while one list at the
  // top is the claim the caller needs.
  repeated string evaluated_dimensions = 6;
}

message DeletePlanResponse { bool deleted = 1; }

service PlatformService {
  rpc ListOrganizations(ListPlatformOrganizationsRequest) returns (ListPlatformOrganizationsResponse);
  rpc CreateOrganization(CreatePlatformOrganizationRequest) returns (CreatePlatformOrganizationResponse);
  rpc GetOrganization(PlatformOrganizationIdRequest) returns (PlatformOrganizationResponse);
  rpc UpdateOrganization(UpdatePlatformOrganizationRequest) returns (PlatformOrganizationResponse);
  rpc SetOrganizationStatus(SetOrganizationStatusRequest) returns (PlatformOrganizationResponse);
  rpc ResetBillingCycle(ResetBillingCycleRequest) returns (PlatformOrganizationResponse);
  rpc OffboardOrganization(OffboardOrganizationRequest) returns (OffboardOrganizationResponse);
  rpc RestoreOrganization(PlatformOrganizationIdRequest) returns (PlatformOrganizationResponse);

  rpc ListUsers(ListPlatformUsersRequest) returns (ListPlatformUsersResponse);

  rpc ListGlobalRoles(ListGlobalRolesRequest) returns (ListGlobalRolesResponse);
  rpc CreateGlobalRole(CreateGlobalRoleRequest) returns (RoleResponse);

  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  rpc CreatePlan(CreatePlanRequest) returns (SubscriptionPlanResponse);
  rpc GetPlan(PlanIdRequest) returns (SubscriptionPlanResponse);
  rpc UpdatePlan(UpdatePlanRequest) returns (SubscriptionPlanResponse);
  rpc DeletePlan(PlanIdRequest) returns (DeletePlanResponse);
  // Explicit, never implicit: editing a plan changes no subscriber until this
  // is called. A silent fan-out on save would rewrite two hundred tenants'
  // entitlements from a form submit.
  rpc ApplyPlan(ApplyPlanRequest) returns (ApplyPlanResponse);

  rpc GetMetrics(GetPlatformMetricsRequest) returns (PlatformMetricsResponse);

  // **Two RPCs, because they have different failure domains.** The snapshot has
  // a Stripe leg that can degrade; the series is local and therefore always
  // answerable, which is what makes it worth having when the other is degraded.
  rpc GetFinanceSnapshot(GetFinanceSnapshotRequest) returns (FinanceSnapshotResponse);
  rpc ListBillingEvents(ListBillingEventsRequest) returns (ListBillingEventsResponse);
  rpc GetAuthJobHealth(AuthJobHealthRequest) returns (AuthJobHealthResponse);
}
