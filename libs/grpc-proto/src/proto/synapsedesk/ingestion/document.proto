syntax = "proto3";

package synapsedesk.ingestion;

import "google/protobuf/timestamp.proto";
import "synapsedesk/auth/common.proto";

// Domain C's document surface.
//
// The upload is presign -> client PUT -> confirm, the same mechanism avatars
// and attachments already use. Two orderings are easy to get backwards and
// both are specified as:
//
//   - the STORAGE QUOTA is checked at presign, before signing, so a tenant over
//     `max_storage_bytes` never receives a usable upload URL rather than
//     discovering it after uploading 25 MB;
//   - the `documents` ROW is created at CONFIRM, so a presigned upload the
//     client abandons leaves nothing pointing at an object that never arrived.

// Enumerated document columns.
//
// **These were `string` with the members listed in a comment**, which is the
// arrangement that let `documents.file_type` — a `VarChar(20)` — travel onto the
// wire unchecked from the Prisma row all the way to the gateway's mapper. The
// generated enum makes that hop a compile error on the WRITE side, which is the
// side that had no guard at all.
//
// Values carry the enum-name prefix because protobuf enum values use C++
// scoping — they are SIBLINGS of their type, not children — so a bare
// `UNSPECIFIED` in two enums of one package is a compile error, not a style
// complaint. Same rule `ticket/common.proto` states.
enum DocumentStatus {
  DOCUMENT_STATUS_UNSPECIFIED = 0;
  DOCUMENT_STATUS_PENDING = 1;
  DOCUMENT_STATUS_PROCESSING = 2;
  DOCUMENT_STATUS_INDEXED = 3;
  DOCUMENT_STATUS_FAILED = 4;
}

// Where one ingestion attempt got to. Mirrors `IngestionJobStatus` in
// `document.config.ts`.
//
// **`CANCELLED` is deliberately absent from `DocumentStatus` above.** A
// cancelled job leaves its document `FAILED`, because that enum's own
// documentation delegates the reason here — the document says "not indexed",
// the job says why. `AiGenerationStatus` draws the same line.
enum IngestionJobStatus {
  INGESTION_JOB_STATUS_UNSPECIFIED = 0;
  INGESTION_JOB_STATUS_QUEUED = 1;
  INGESTION_JOB_STATUS_PARSING = 2;
  INGESTION_JOB_STATUS_CHUNKING = 3;
  INGESTION_JOB_STATUS_EMBEDDING = 4;
  INGESTION_JOB_STATUS_COMPLETED = 5;
  INGESTION_JOB_STATUS_FAILED = 6;
  INGESTION_JOB_STATUS_CANCELLED = 7;
}

// The EXTENSION a document is filed under, not its MIME type — the distinction
// the `DocumentFileType` doc comment exists to make. The column holds `pdf`; a
// filter naming `application/pdf` matches no row and reports no error.
//
// `BIN` is a real stored value, not a sentinel: confirm writes it for any
// accepted type with no extension mapping. It is distinct from UNSPECIFIED,
// which means the field was not set.
enum DocumentFileType {
  DOCUMENT_FILE_TYPE_UNSPECIFIED = 0;
  DOCUMENT_FILE_TYPE_PDF = 1;
  DOCUMENT_FILE_TYPE_TXT = 2;
  DOCUMENT_FILE_TYPE_MD = 3;
  DOCUMENT_FILE_TYPE_BIN = 4;
  DOCUMENT_FILE_TYPE_DOC = 5;
  DOCUMENT_FILE_TYPE_DOCX = 6;
}

enum DocumentFlagType {
  DOCUMENT_FLAG_TYPE_UNSPECIFIED = 0;
  DOCUMENT_FLAG_TYPE_OUTDATED = 1;
  DOCUMENT_FLAG_TYPE_UNRETRIEVED = 2;
  // A genuinely different finding from UNRETRIEVED — it keeps winning a context
  // slot without earning one, displacing the sources that would have answered.
  // The two were once one flag, and the filter must keep them apart.
  DOCUMENT_FLAG_TYPE_UNCITED = 3;
  DOCUMENT_FLAG_TYPE_LOW_CONFIDENCE = 4;
  DOCUMENT_FLAG_TYPE_NEGATIVE_FEEDBACK = 5;
  DOCUMENT_FLAG_TYPE_CONFLICTING = 6;
  // Raised by ingestion itself at index time. Its provenance
  // differs from every value above: those are observations about how a document
  // has been USED, this is a fact about the document.
  DOCUMENT_FLAG_TYPE_PAGES_NOT_INDEXED = 7;
}

// How a human dealt with a flag. Only DISMISSED suppresses a later detection,
// and only for a window — FIXED and DOCUMENT_REPLACED assert the problem is
// gone, so a detector finding it again is reporting news.
enum DocumentFlagResolution {
  DOCUMENT_FLAG_RESOLUTION_UNSPECIFIED = 0;
  DOCUMENT_FLAG_RESOLUTION_FIXED = 1;
  DOCUMENT_FLAG_RESOLUTION_DISMISSED = 2;
  DOCUMENT_FLAG_RESOLUTION_DOCUMENT_REPLACED = 3;
}

enum DocumentFlagSeverity {
  DOCUMENT_FLAG_SEVERITY_UNSPECIFIED = 0;
  DOCUMENT_FLAG_SEVERITY_INFO = 1;
  DOCUMENT_FLAG_SEVERITY_WARNING = 2;
  DOCUMENT_FLAG_SEVERITY_CRITICAL = 3;
}

message DocumentResponse {
  string id = 1;
  string organization_id = 2;
  string created_by_id = 3;
  string title = 4;
  // An object PATH, not a URL. Reads resolve it per request.
  string file_url = 5;
  DocumentFileType file_type = 6;
  int64 file_size_bytes = 7;
  bool is_organization_wide = 8;
  DocumentStatus status = 9;
  repeated string department_ids = 10;
  int32 chunk_count = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  optional google.protobuf.Timestamp deleted_at = 14;
  optional string deleted_by_id = 15;
  // ISO 639-1 codes the uploader declared for OCR.
  //
  // Empty means "not specified", which is almost every document: an uploader
  // cannot know a PDF is scanned until it is parsed. `repeated` needs no
  // `optional` — proto3 repeated fields are already absent-by-default.
  repeated string ocr_languages = 16;
}

message PresignDocumentRequest {
  string content_type = 1;
  int64 size_bytes = 2;
  string file_name = 3;
}

message PresignDocumentResponse {
  string upload_url = 1;
  string object_path = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message ConfirmDocumentRequest {
  string object_path = 1;
  string title = 2;
  bool is_organization_wide = 3;
  repeated string department_ids = 4;
  string file_name = 5;
  // ISO 639-1, validated at the gateway against `OCR_LANGUAGES`.
  //
  // NOT tesseract's own codes: the engine wants `vie`/`chi_sim`, and storing
  // those would put the engine's alphabet in the API contract and in every row.
  repeated string ocr_languages = 6;
}

message ListDocumentsRequest {
  synapsedesk.auth.PageRequest page = 1;
  // UNSPECIFIED means "no filter", which is what proto3's zero value is for —
  // and why neither of these is `optional`.
  DocumentStatus status = 2;
  string department_id = 3;
  DocumentFileType file_type = 4;
  bool include_deleted = 5;
}

message ListDocumentsResponse {
  repeated DocumentResponse items = 1;
  synapsedesk.auth.PageMeta meta = 2;
}

message DocumentIdRequest { string id = 1; }

message UpdateDocumentRequest {
  string id = 1;
  optional string title = 2;
  optional bool is_organization_wide = 3;
}

message SetDocumentDepartmentsRequest {
  string id = 1;
  repeated string department_ids = 2;
}

message ListDocumentDepartmentsResponse { repeated string department_ids = 1; }

message DeleteDocumentResponse {}

message DownloadDocumentResponse {
  string download_url = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message DocumentChunkResponse {
  string id = 1;
  string document_id = 2;
  int32 chunk_index = 3;
  string content_text = 4;
  optional int32 page_number = 5;
  int32 token_count = 6;
  optional string vector_point_id = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ListDocumentChunksRequest {
  string document_id = 1;
  synapsedesk.auth.PageRequest page = 2;
}

message ListDocumentChunksResponse {
  repeated DocumentChunkResponse items = 1;
  synapsedesk.auth.PageMeta meta = 2;
}

message GetDocumentChunkRequest {
  string document_id = 1;
  string chunk_id = 2;
}

message DocumentFlagResponse {
  string id = 1;
  string document_id = 2;
  string document_title = 3;
  DocumentFlagType flag_type = 4;
  DocumentFlagSeverity severity = 5;
  string detail = 6;
  optional double confidence_score = 7;
  google.protobuf.Timestamp detected_at = 8;
  optional google.protobuf.Timestamp resolved_at = 9;
  // A bare id, never a hydrated user: it crosses a service boundary with no FK
  // (ADR 0022), and resolving it here would make every flag list an N+1.
  optional string resolved_by_id = 10;
  // UNSPECIFIED when the flag is still open.
  DocumentFlagResolution resolution = 11;
  optional string resolution_comment = 12;
  optional string related_document_id = 13;
  optional string related_chunk_id = 14;
}

message ListDocumentFlagsRequest {
  // EMPTY means every type, and the filter accepts more than one.
  //
  // `UNRETRIEVED` and `UNCITED` were once a single flag under a name
  // that fitted only one of them. A filter that accepts only `UNCITED` would
  // quietly re-merge them in the UI, because the type nobody can select is the
  // type nobody sees.
  repeated DocumentFlagType flag_types = 1;
  // Unresolved only, by default — a resolved flag is history, not a task.
  bool include_resolved = 2;
  synapsedesk.auth.PageRequest page = 3;
  // UNSPECIFIED means no filter.
  DocumentFlagSeverity severity = 4;
  // "" means no filter.
  string document_id = 5;
}

message DocumentFlagIdRequest { string id = 1; }

// ---------------------------------------------------------------------------
// Knowledge articles — the END-USER view of the same corpus.
//
// An article is a document that is VISIBLE to the caller, INDEXED, and not
// soft-deleted. All three: `documentVisibility` is only the org-wide ∪
// departments clause, and a soft-deleted document keeps `status = INDEXED`
// forever, so the first two alone would list deleted documents by title.
//
// A NARROW type, not `DocumentResponse` behind a mapper that chooses not to
// forward things. `DocumentResponse` carries `file_url`, `file_hash`,
// `file_size_bytes`, `created_by_id` and the department links, and the next
// field added to it would reach an end user by default (ADR 0031, ADR 0014).
// ---------------------------------------------------------------------------

message KnowledgeArticleResponse {
  string id = 1;
  string title = 2;
  google.protobuf.Timestamp updated_at = 3;
  // `chunk_count`, not a page count: `DocumentChunk.page_number` is nullable —
  // a `.md` or `.txt` article has no pages — and it doubles as the only
  // reading-length signal on a response that deliberately omits
  // `file_size_bytes`.
  int32 chunk_count = 4;
}

message ListKnowledgeArticlesRequest {
  synapsedesk.auth.PageRequest page = 1;
}

message ListKnowledgeArticlesResponse {
  repeated KnowledgeArticleResponse items = 1;
  synapsedesk.auth.PageMeta meta = 2;
}

// One block of an article's extracted text.
//
// The chunks the pipeline already wrote, in `chunk_index` order — no second
// copy of the document, and the only form that renders in a browser without a
// download.
message KnowledgeArticleBlockResponse {
  int32 chunk_index = 1;
  // Absent for formats with no pages. Never faked as 1.
  optional int32 page_number = 2;
  string content_text = 3;
}

// Carries a PAGE, because a whole document is unbounded: `CHUNK_TARGET_TOKENS`
// bounds each block and a 200-page handbook is hundreds of them.
message GetKnowledgeArticleRequest {
  string id = 1;
  synapsedesk.auth.PageRequest page = 2;
}

message KnowledgeArticleDetailResponse {
  KnowledgeArticleResponse article = 1;
  repeated KnowledgeArticleBlockResponse blocks = 2;
  // Describes the BLOCK range, not a page of articles.
  synapsedesk.auth.PageMeta meta = 3;
  // True when some of the source could not be read, so the blocks are less
  // than the document. `chunk_index` is contiguous over what SURVIVED, so
  // there is no gap for a reader to notice.
  //
  // Sound only because a clean re-index now CLOSES `PAGES_NOT_INDEXED`
  // (`DocumentFlagWriter.resolveSystem`). Read from an unresolved flag without
  // that, it would stay true after the pages were fixed, and a warning that
  // never clears teaches readers to ignore the true one.
  bool has_unindexed_pages = 4;
}

// One RPC for three routes: dismiss, fixed and replaced differ only in the
// value they carry.
message ResolveDocumentFlagRequest {
  string id = 1;
  DocumentFlagResolution resolution = 2;
  optional string comment = 3;
}

message DeleteDocumentFlagResponse { bool deleted = 1; }

message ListDocumentFlagsResponse {
  repeated DocumentFlagResponse items = 1;
  synapsedesk.auth.PageMeta meta = 2;
}

message StorageUsageResponse {
  int64 used_bytes = 1;
  int64 limit_bytes = 2;
  int32 document_count = 3;
}


// ---------------------------------------------------------------------------
// `ListXByIds` — the contract behind every DataLoader.
//
// Six properties, and five of them are things DataLoader depends on:
//
//   1. TENANT-SCOPED from the caller context, never from a request field. The
//      id is a loader's cache key and carries no tenant, so this RPC is the
//      only thing standing between a uuid and another tenant's row.
//   2. MISSING IDS ARE OMITTED, never an error. A batch of 50 where one row was
//      deleted returns 49; erroring fails 50 fields for one absent row.
//   3. DUPLICATE IDS COLLAPSE. `IN (…)` handles it; the response must not
//      double-count.
//   4. EMPTY REQUEST -> EMPTY RESPONSE, not an error. A page where nothing has
//      an assignee is a valid page.
//   5. BATCH SIZE CAPPED, and the cap is an ERROR rather than a truncation —
//      truncation is indistinguishable from missing data.
//   6. ORDER IS NOT GUARANTEED. The response is a SET; the caller maps it back
// onto its keys, because a database returns `WHERE id IN
//      ('c','a','b')` as a, b, c and handing that straight to DataLoader
//      renders the wrong entity against every key.
//
// SOFT DELETES ARE VISIBLE BY ID. A ticket citing a deleted user still needs to
// render someone; omitting it makes property 2 fire for a row that exists.
// ---------------------------------------------------------------------------
message ListDocumentsByIdsRequest { repeated string document_ids = 1; }

message ListDocumentsByIdsResponse { repeated DocumentResponse items = 1; }

// Citation previews. **The largest payloads in the system** — a chunk carries
// its whole text — so this one is capped hardest.
message ListDocumentChunksByIdsRequest { repeated string chunk_ids = 1; }

message DocumentChunkSummary {
  string chunk_id = 1;
  string document_id = 2;
  string document_title = 3;
  optional int32 page_number = 4;
  int32 chunk_index = 5;
  string content_text = 6;
}

message ListDocumentChunksByIdsResponse {
  repeated DocumentChunkSummary items = 1;
}

// One ingestion attempt, as the pipeline dashboard reads it.
message IngestionJobResponse {
  string id = 1;
  string document_id = 2;
  // Empty until the worker records it — the row is created in the same
  // transaction as the document, before BullMQ has accepted anything, so an
  // empty value here is a job that has not been queued yet rather than a bug.
  string bullmq_job_id = 3;
  IngestionJobStatus status = 4;
  string error_log = 5;
  // Set when the attempt reached a terminal state. Absent while it is still
  // running, which is why this one is `optional` and `created_at` is not.
  optional google.protobuf.Timestamp processed_at = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ListIngestionJobsRequest {
  synapsedesk.auth.PageRequest page = 1;
  // UNSPECIFIED and "" mean "no filter", which is what proto3's zero value is
  // for — and why neither is `optional`. Same convention as
  // `ListDocumentsRequest`.
  IngestionJobStatus status = 2;
  string document_id = 3;
}

message ListIngestionJobsResponse {
  repeated IngestionJobResponse items = 1;
  synapsedesk.auth.PageMeta meta = 2;
}

message IngestionJobIdRequest { string id = 1; }

message CancelIngestionJobResponse { bool cancelled = 1; }

service DocumentService {
  rpc ListDocumentsByIds(ListDocumentsByIdsRequest) returns (ListDocumentsByIdsResponse);
  rpc ListDocumentChunksByIds(ListDocumentChunksByIdsRequest) returns (ListDocumentChunksByIdsResponse);
  rpc PresignDocument(PresignDocumentRequest) returns (PresignDocumentResponse);
  rpc ConfirmDocument(ConfirmDocumentRequest) returns (DocumentResponse);

  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc GetDocument(DocumentIdRequest) returns (DocumentResponse);
  rpc UpdateDocument(UpdateDocumentRequest) returns (DocumentResponse);
  rpc DeleteDocument(DocumentIdRequest) returns (DeleteDocumentResponse);
  rpc RestoreDocument(DocumentIdRequest) returns (DocumentResponse);
  rpc DownloadDocument(DocumentIdRequest) returns (DownloadDocumentResponse);

  rpc ListDocumentDepartments(DocumentIdRequest) returns (ListDocumentDepartmentsResponse);
  rpc SetDocumentDepartments(SetDocumentDepartmentsRequest) returns (DocumentResponse);

  rpc ListDocumentChunks(ListDocumentChunksRequest) returns (ListDocumentChunksResponse);
  rpc GetDocumentChunk(GetDocumentChunkRequest) returns (DocumentChunkResponse);

  rpc ListDocumentFlags(ListDocumentFlagsRequest) returns (ListDocumentFlagsResponse);
  rpc GetDocumentFlag(DocumentFlagIdRequest) returns (DocumentFlagResponse);

  // The end-user help centre over the same corpus. On this service for the
  // reason the flag and job RPCs are: one database, one client, one health
  // entry.
  rpc ListKnowledgeArticles(ListKnowledgeArticlesRequest) returns (ListKnowledgeArticlesResponse);
  rpc GetKnowledgeArticle(GetKnowledgeArticleRequest) returns (KnowledgeArticleDetailResponse);
  rpc ResolveDocumentFlag(ResolveDocumentFlagRequest) returns (DocumentFlagResponse);
  rpc DeleteDocumentFlag(DocumentFlagIdRequest) returns (DeleteDocumentFlagResponse);

  rpc GetStorageUsage(DocumentIdRequest) returns (StorageUsageResponse);

  // On this service rather than its own: a second service would need a second
  // client, a second health entry and a second registration for five methods
  // that share a database and a permission family.
  rpc ListIngestionJobs(ListIngestionJobsRequest) returns (ListIngestionJobsResponse);
  rpc GetIngestionJob(IngestionJobIdRequest) returns (IngestionJobResponse);
  rpc RetryIngestionJob(IngestionJobIdRequest) returns (IngestionJobResponse);
  rpc CancelIngestionJob(IngestionJobIdRequest) returns (CancelIngestionJobResponse);
  // Unpaginated, and reusing `DocumentIdRequest`: retries are rare, and a
  // document with enough jobs to need a page is a document with a problem a
  // page boundary would hide.
  rpc ListDocumentIngestionJobs(DocumentIdRequest) returns (ListIngestionJobsResponse);
}
