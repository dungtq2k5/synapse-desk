syntax = "proto3";

package synapsedesk.ticket;

import "google/protobuf/timestamp.proto";
import "synapsedesk/auth/common.proto";

// Thumbs on AI-generated replies — the signal that tells Domain C whether the
// model is helping.

message FeedbackResponse {
  string id = 1;
  string ticket_message_id = 2;
  string user_id = 3;
  string organization_id = 4;
  // 1 or -1. A thumb, not a scale — constrained in the service and by a CHECK
  // the seeder applies, because Prisma expresses neither.
  int32 rating = 5;
  optional string feedback_text = 6;
  optional bool citation_accurate = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// An UPSERT, not an insert: `(ticket_message_id, user_id)` is unique, so a user
// may change their mind from a thumbs-up to a thumbs-down without being
// double-counted in every quality metric.
message SubmitFeedbackRequest {
  string ticket_message_id = 1;
  int32 rating = 2;
  optional string feedback_text = 3;
  optional bool citation_accurate = 4;
}

message ListFeedbackRequest {
  synapsedesk.auth.PageRequest page = 1;
  // 0 means "no filter" — the only legal ratings are 1 and -1, so zero is
  // unambiguous here in a way an empty string would not be.
  int32 rating = 2;
  optional bool citation_accurate = 3;
  optional google.protobuf.Timestamp from = 4;
  optional google.protobuf.Timestamp to = 5;
}

message ListFeedbackResponse {
  repeated FeedbackResponse items = 1;
  synapsedesk.auth.PageMeta meta = 2;
}

message WithdrawFeedbackRequest {
  string ticket_message_id = 1;
}

message WithdrawFeedbackResponse {}

service FeedbackService {
  rpc SubmitFeedback(SubmitFeedbackRequest) returns (FeedbackResponse);
  rpc ListFeedback(ListFeedbackRequest) returns (ListFeedbackResponse);
  rpc WithdrawFeedback(WithdrawFeedbackRequest) returns (WithdrawFeedbackResponse);
}
