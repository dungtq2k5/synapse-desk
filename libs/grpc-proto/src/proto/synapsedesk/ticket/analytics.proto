syntax = "proto3";

package synapsedesk.ticket;

import "google/protobuf/timestamp.proto";

// The read projection over Domain B.
//
// **Served by ticket-service, not by an `analytics-service`.** A service with
// no tables of its own either reads another service's database — breaking the
// boundary every other decision depends on, and doing it as an UNDECLARED
// dependency nothing in the repo records — or ETLs into its own store, which is
// a real project rather than a way to serve eleven endpoints.
//
// Everything here reads DAILY ROLLUPS, never the OLTP tables. A dashboard load
// aggregating a quarter of tickets competes with ticket creation, and no
// endpoint design fixes that.

// A rate and the count it was computed over
//
// **Every rate carries its denominator.** A percentage with a hidden
// denominator is how "our CSAT is 100%" reaches a board deck on two responses.
message RateValue {
  // Absent when the denominator is zero. "Nobody rated anything" and
  // "everybody rated it negative" are different facts, and rendering the first
  // as 0% is a wrong answer rather than a missing one.
  optional double rate = 1;
  int32 numerator = 2;
  int32 denominator = 3;
}

// A mean and its count. Same reasoning as `RateValue`.
message MeanValue {
  optional double mean = 1;
  int32 count = 2;
}

// The shared filter. `from`/`to` are DATES in the tenant's timezone.
message AnalyticsRangeRequest {
  // Inclusive, `YYYY-MM-DD`. A date rather than a timestamp because the rollups
  // are bucketed by the tenant's local day, and an instant would invite a
  // caller to think it selects a sub-day window that does not exist.
  string from = 1;
  string to = 2;
  // Absent = every department, including tickets with none.
  optional string department_id = 3;
  // DAY | WEEK | MONTH.
  optional string granularity = 4;
}

message OverviewResponse {
  int32 tickets_created = 1;
  int32 tickets_resolved = 2;
  int32 tickets_escalated = 3;
  int32 open_tickets = 4;

  RateValue deflection = 5;
  RateValue csat = 6;
  MeanValue human_first_response_seconds = 7;
  MeanValue ai_first_response_seconds = 8;
  MeanValue resolution_seconds = 9;

  // The counterweight to `resolution_seconds`, which is biased OPTIMISTIC
  // because it can only see tickets that closed — a ticket open for 40 days is
  // invisible to it.
  optional int64 open_ticket_median_age_seconds = 10;

  // When the rollups behind this answer were computed. Carried so a caller can
  // tell a stale answer from a quiet tenant, and so an export can record which
  // run produced its numbers.
  optional google.protobuf.Timestamp computed_at = 11;

  // **The last DAY the rollups cover for this tenant**, as
  // `YYYY-MM-DD`, or absent when no rollup has ever run.
  //
  // NOT the same fact as `computed_at`, and the difference is the point:
  // `computed_at` says the job ran, `data_through` says what it covered. A
  // scheduler that stopped a week ago still produces a recent `computed_at` on
  // every backfill-free run, while `data_through` stops moving — which is the
  // symptom somebody looking at a dashboard of zeros needs to see.
  //
  // Tenant-wide rather than clipped to the requested range: "how fresh is our
  // data" must not change its answer because the caller asked about March.
  optional string data_through = 12;
}

message DeflectionPoint {
  string day = 1;
  RateValue deflection = 2;
  int32 chat_conversations = 3;
  int32 chat_resolved_without_escalation = 4;
}

message DeflectionResponse {
  repeated DeflectionPoint points = 1;
  RateValue total = 2;
  // See `OverviewResponse.data_through`.
  optional string data_through = 3;
}

message ResponseTimePoint {
  string day = 1;
  // Reported SEPARATELY, always. Blending them produces a headline that
  // improves whenever AI usage rises — the metric measuring itself.
  MeanValue human_first_response_seconds = 2;
  MeanValue ai_first_response_seconds = 3;
  MeanValue resolution_seconds = 4;
}

message ResponseTimesResponse {
  repeated ResponseTimePoint points = 1;
  MeanValue human_total = 2;
  MeanValue ai_total = 3;
  MeanValue resolution_total = 4;
  // See `OverviewResponse.data_through`.
  optional string data_through = 5;
}

message VolumePoint {
  string day = 1;
  int32 created = 2;
  int32 resolved = 3;
  int32 escalated = 4;
}

// A single dimension's breakdown — status, priority or source.
message VolumeBreakdown {
  string key = 1;
  int32 count = 2;
}

message VolumeResponse {
  repeated VolumePoint points = 1;
  // Current state rather than a time series: "how many are OPEN right now" is
  // not a question a daily rollup of events can answer, and pretending it is
  // would report the status a ticket had on the day it was created.
  repeated VolumeBreakdown by_status = 2;
  repeated VolumeBreakdown by_priority = 3;
  repeated VolumeBreakdown by_source = 4;
  // See `OverviewResponse.data_through`.
  optional string data_through = 5;
}

message SatisfactionPoint {
  string day = 1;
  RateValue csat = 2;
  RateValue citation_accuracy = 3;
}

message SatisfactionResponse {
  repeated SatisfactionPoint points = 1;
  RateValue csat_total = 2;
  RateValue citation_accuracy_total = 3;
  // See `OverviewResponse.data_through`.
  optional string data_through = 4;
}

// Per-agent productivity. Names are hydrated by the GATEWAY — this service
// stores an agent id and nothing else about the person (RDM §1.13).
message AgentStat {
  string agent_id = 1;
  int32 assigned = 2;
  int32 resolved = 3;
  int32 messages_sent = 4;
  MeanValue resolution_seconds = 5;
}

message AgentStatsResponse {
  repeated AgentStat items = 1;
  // Reads `agent_daily_stats`, a DIFFERENT table from the one behind the other
  // five — so it can legitimately be staler, and says so itself.
  optional string data_through = 2;
}

// The rollup job, exposed so a scheduler and an operator can both reach it.
// ---------------------------------------------------------------------------
// Job health.
//
// **Alerting on staleness rather than on failure.** A failed job logs; a job
// that never ran logs nothing at all, which is precisely what happened here --
// seven scheduled jobs with no scheduler, producing zeros that every endpoint
// reported correctly. `last_succeeded_at` going stale fires for BOTH cases, and
// they are indistinguishable from outside.
message JobHealthRequest {}

message JobRunStatus {
  string job_name = 1;
  optional google.protobuf.Timestamp last_started_at = 2;
  // **Preserved across a failure**, deliberately -- this is what the staleness
  // check reads, and clearing it would turn "broken since Tuesday" into
  // "never ran".
  optional google.protobuf.Timestamp last_succeeded_at = 3;
  optional int32 last_duration_ms = 4;
  optional string last_error = 5;
  int32 consecutive_failures = 6;
}

message JobHealthResponse {
  repeated JobRunStatus items = 1;
}

message RunRollupRequest {
  // Both inclusive, `YYYY-MM-DD`. Absent = the routine trailing window.
  optional string from = 1;
  optional string to = 2;
}

message RunRollupResponse {
  int32 tenants = 1;
  int32 ticket_rows = 2;
  int32 agent_rows = 3;
}

// The async export

enum AnalyticsExportKind {
  ANALYTICS_EXPORT_KIND_UNSPECIFIED = 0;
  // Daily ticket rollups: the numbers behind `overview`, `volume`, `deflection`.
  ANALYTICS_EXPORT_KIND_TICKET_DAILY = 1;
  ANALYTICS_EXPORT_KIND_AGENT_DAILY = 2;
}

enum AnalyticsExportStatus {
  ANALYTICS_EXPORT_STATUS_UNSPECIFIED = 0;
  ANALYTICS_EXPORT_STATUS_PENDING = 1;
  ANALYTICS_EXPORT_STATUS_READY = 2;
  // **Reported as a failure, never as an empty file.** An empty CSV reads as
  // "no data", which is a wrong answer rather than an error.
  ANALYTICS_EXPORT_STATUS_FAILED = 3;
}
message CreateExportRequest {
  AnalyticsExportKind kind = 1;
  string from = 2;
  string to = 3;
  optional string department_id = 4;
}

message ExportResponse {
  string id = 1;
  AnalyticsExportStatus status = 2;
  AnalyticsExportKind kind = 3;
  optional int32 row_count = 4;
  // The newest rollup run behind the file — the disputed-number guard. Two
  // people exporting "last quarter" a week apart can see whether the data was
  // recomputed between them rather than guessing.
  optional google.protobuf.Timestamp rollup_computed_at = 5;
  // Minted PER REQUEST and short-lived: a URL to a tenant's full ticket
  // history is a credential, so it is never stored on the row.
  optional string download_url = 6;
  optional string error = 7;
  google.protobuf.Timestamp created_at = 8;
  optional google.protobuf.Timestamp completed_at = 9;
}

message GetExportRequest { string id = 1; }

service AnalyticsService {
  rpc CreateExport(CreateExportRequest) returns (ExportResponse);
  rpc GetExport(GetExportRequest) returns (ExportResponse);

  rpc GetOverview(AnalyticsRangeRequest) returns (OverviewResponse);
  rpc GetDeflection(AnalyticsRangeRequest) returns (DeflectionResponse);
  rpc GetResponseTimes(AnalyticsRangeRequest) returns (ResponseTimesResponse);
  rpc GetVolume(AnalyticsRangeRequest) returns (VolumeResponse);
  rpc GetSatisfaction(AnalyticsRangeRequest) returns (SatisfactionResponse);
  rpc GetAgentStats(AnalyticsRangeRequest) returns (AgentStatsResponse);

  // Platform-operated, never routed by the gateway for a tenant: a backfill
  // recomputes numbers a customer may already have exported.
  rpc RunRollup(RunRollupRequest) returns (RunRollupResponse);
  rpc GetJobHealth(JobHealthRequest) returns (JobHealthResponse);
}
