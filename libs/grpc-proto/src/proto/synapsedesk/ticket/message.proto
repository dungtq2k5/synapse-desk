syntax = "proto3";

package synapsedesk.ticket;

import "google/protobuf/timestamp.proto";
import "synapsedesk/auth/common.proto";
import "synapsedesk/ticket/ai.proto";

// The ticket thread, plus attachments.
//
// `is_internal_note` is stripped in the WHERE clause for a non-agent, never
// fetched-then-filtered: filtering at serialization leaks the note's existence
// through response timing and through any client that forgets to filter.

// `AnswerStatus`, mirrored from `synapsedesk.rag` rather than imported — the
// same call `AiAttachmentPart` further down makes, and for the same reason: a
// proto import would point this package at rag's, which is backwards. rag is
// downstream of ticket, not the other way round.
//
// **PREFIXED, and not for style.** ts-proto flattens every package into one
// TypeScript barrel, and `export *` silently DROPS any name two modules both
// export — a bare `AnswerStatus` here would delete rag's from the public API
// with no error anywhere. `AiRateValue` carries a prefix for exactly this
// reason. `barrel-collisions.spec.ts` now checks it rather than trusting it.
//
// **The NUMBERING is the contract.** Unlike ts-proto's message interfaces,
// which are structural, generated enums are TypeScript enums and therefore
// NOMINAL — rag's `DOC_ANSWER` is not assignable to this type even though both
// are `1`. So the two are bridged by `toMessageAnswerStatus`, whose whole job is
// to be a numeric identity, and `mappers.spec.ts` asserts member-for-member that
// it still is.
enum MessageAnswerStatus {
  MESSAGE_ANSWER_STATUS_UNSPECIFIED = 0;
  // Answered from the corpus, with citations.
  MESSAGE_ANSWER_STATUS_DOC_ANSWER = 1;
  // Nothing retrieved above threshold — the escalation case, never an
  // invitation to improvise.
  MESSAGE_ANSWER_STATUS_DOC_MISSING = 2;
  // A greeting, answered from the canned table. No LLM call, no ledger row.
  MESSAGE_ANSWER_STATUS_GREETING = 3;
  // The tenant is at the AI cap. The caller escalates rather than erroring.
  MESSAGE_ANSWER_STATUS_AT_CAP = 4;
  // Refused by prompt-injection detection. **Not GREETING**: a
  // refusal filed as a greeting is wrong in the thread, in the WebSocket frame
  // and in anything reading the trail afterwards.
  MESSAGE_ANSWER_STATUS_REFUSED = 5;
}

message AttachmentResponse {
  string id = 1;
  string message_id = 2;
  string file_name = 3;
  string file_url = 4;
  int64 file_size_bytes = 5;
  string mime_type = 6;
  google.protobuf.Timestamp created_at = 7;
}

message MessageResponse {
  string id = 1;
  string ticket_id = 2;
  // Absent for an AI-generated message: no user wrote it, and naming one would
  // put words in a real person's mouth in the audit trail.
  optional string sender_id = 3;
  string content = 4;
  bool is_ai_generated = 5;
  bool is_internal_note = 6;
  optional string model_name = 7;
  optional int32 prompt_tokens = 8;
  optional int32 completion_tokens = 9;
  optional google.protobuf.Timestamp edited_at = 10;
  optional google.protobuf.Timestamp redacted_at = 11;
  google.protobuf.Timestamp created_at = 12;
  repeated AttachmentResponse attachments = 13;
  // Whether this message is kept OUT of AI prompts.
  //
  // On the read shape because the gateway's transcript builder filters AFTER
  // the fetch, and cannot filter on what it cannot see. Deliberately not a
  // `where` clause on `ListMessages`: that route serves the UI, where a refused
  // message must stay visible.
  bool excluded_from_ai_context = 14;
  // `AnswerStatus` for an AI message. UNSPECIFIED for a human one — no
  // `optional`, because the zero value already carries exactly that meaning.
  //
  // For reading a thread: an agent scrolling a conversation should be able to
  // tell a refusal from an escalation from a real answer, which was impossible
  // while the status lived only in a WebSocket frame nobody persisted.
  MessageAnswerStatus answer_status = 15;
  // Absent for a human message and for an AI message written before citations
  // were persisted; present (possibly empty) for every AI answer since.
  optional MessageCitations citations = 16;
}

message CreateMessageRequest {
  string ticket_id = 1;
  string content = 2;
  bool is_internal_note = 3;
  // Persists the caller's message FIRST, then asks for an AI draft as a second,
  // separate write. Two writes on purpose: the draft can legitimately fail
  // (rag-service down) without losing what the human typed.
  bool invoke_ai = 4;
  // The `ai_generations` row this reply came from, when an agent is posting a
  // co-pilot draft. Closes the ACCEPTANCE LOOP: ticket-service compares the
  // sent text against the stored draft and records ACCEPTED or EDITED, which
  // is the one number that justifies the co-pilot existing.
  //
  // Absent for an ordinary reply, and absent is not an error — most replies
  // are typed by a human from nothing.
  optional string generated_from_id = 5;
  // The SENDER's own id, for idempotency.
  //
  // Absent for an HTTP call and REQUIRED for the WebSocket path, because a
  // socket that reconnects with an unacked message re-emits it. A duplicate
  // returns the ORIGINAL message rather than an error: the client's intent was
  // satisfied, and an error would make it retry again.
  optional string client_message_id = 6;

  // The inbound email's `Message-ID`, when this write came from mail
  // Written as an `inbound_emails` row in the SAME transaction, so a
  // provider redelivery is a duplicate-key violation rather than a second
  // reply. Absent for every other transport, and absent is not an error.
  optional string inbound_message_id = 7;

  // Objects the client already uploaded, bound to the message as it is created
  //
  //
  // **This is what makes a first-turn attachment readable.** Presign and
  // confirm both took a `message_id`, so the row could only exist after the
  // message did, while `invoke_ai` runs during the create: the screenshot was
  // stored a moment after the answer that needed it. Binding here is
  // STRUCTURAL — there is no ordering left for a client to get wrong — where
  // "ask for the answer once the confirms land" would have been a client
  // contract that a slow upload or a retry quietly breaks.
  //
  // Each path is confirmed against storage-service before the write. A path
  // that fails comes back in `skipped_attachments` and the message is still
  // created; that is the only safe outcome.
  repeated NewAttachment attachments = 8;
}

// One already-uploaded object, waiting to be bound to a message.
//
// No size or MIME type: both are read back from the OBJECT at confirm, never
// taken from the client — the rule `confirmAttachment` already follows, and the
// reason a row cannot record whatever the caller felt like claiming.
message NewAttachment {
  string object_path = 1;
  string file_name = 2;
}

// What `CreateMessage` answers with.
//
// A wrapper rather than a bare `MessageResponse`, because a create now has a
// second outcome to report: an attachment whose confirm failed is SKIPPED and
// named, and the message is created regardless. Folding the names into
// `MessageResponse` would put a field on every read that only a create can ever
// populate.
message CreateMessageResponse {
  MessageResponse message = 1;
  // File names, never object paths and never contents. The same rule the AI's
  // skipped list follows, and for the same reason: this is the text a user
  // reads.
  repeated string skipped_attachments = 2;
}

// Persists a STREAMED AI answer, write #2.
//
// The gateway holds the `Chat` stream, because tokens have to reach a socket
// and ticket-service has none. What it does NOT hold is the shape of an AI
// message: `sender_id` stays null, `is_ai_generated` stays true, and
// `ticket.message_created` still publishes from here — so the streamed reply
// and the unary `invoke_ai` reply produce the same row and the same event.
//
// **Service-internal.** No REST route and no socket event reaches this: it is
// called only by the gateway's stream relay, with content that came from
// rag-service. Routing a client-supplied body here would let a customer post
// arbitrary text attributed to the assistant, in a thread they can read.
message AppendAiMessageRequest {
  string ticket_id = 1;
  string content = 2;
  // The `ai_generations` row the answer came from, when there is one. Absent
  // for a canned greeting, which never reaches an LLM and never gets a row.
  optional string generation_id = 3;
  // The status this answer was produced with, persisted on the row.
  //
  // UNSPECIFIED for a canned greeting. The gateway held this in the completion
  // frame and threw it away on write, so a thread could not distinguish a
  // refusal from an answer once the socket closed.
  MessageAnswerStatus answer_status = 4;
  // What the answer cited, persisted on the row. Absent leaves the column NULL;
  // present with no items stores `[]`, an answer that cited nothing.
  optional MessageCitations citations = 5;
}

// A message's citations, as a message so that ABSENT and EMPTY stay distinct.
//
// Do not flatten this to a bare `repeated` field: the loader runs with
// `defaults: true`, which delivers an unset list as `[]`.
message MessageCitations {
  repeated DraftCitation items = 1;
}

// Marks a message as unusable for AI context.
//
// **A separate RPC rather than a flag on `UpdateMessage`**, because that route
// edits CONTENT on behalf of a human and carries authorship rules with it. This
// is the system recording something about a message it just processed, and
// giving it its own name keeps "an agent edited their reply" and "the guard
// refused this question" from sharing a permission check.
message ExcludeFromAiContextRequest {
  string ticket_id = 1;
  string message_id = 2;
}

message ListMessagesRequest {
  string ticket_id = 1;
  synapsedesk.auth.PageRequest page = 2;
}

message ListMessagesResponse {
  repeated MessageResponse items = 1;
  synapsedesk.auth.PageMeta meta = 2;
}

message UpdateMessageRequest {
  string ticket_id = 1;
  string message_id = 2;
  string content = 3;
}

message RedactMessageRequest {
  string ticket_id = 1;
  string message_id = 2;
}

// Redaction, not deletion — the row's POSITION in the timeline is the thing
// worth preserving, so the response still carries the message.
message RedactMessageResponse {
  MessageResponse message = 1;
}

// Presign → upload → confirm, per storage-service's presign flow. The bytes go
// straight from the client to Firebase Storage; ticket-service only decides
// whether the upload may happen and records it once it has.
message UploadAttachmentRequest {
  string ticket_id = 1;
  // **Absent when the message does not exist yet**. Optional
  // rather than removed, so the `:messageId`-nested routes keep serving
  // "attach to a message that already exists".
  optional string message_id = 2;
  string file_name = 3;
  int64 file_size_bytes = 4;
  string mime_type = 5;
}

message PresignAttachmentResponse {
  string upload_url = 1;
  string object_path = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message ConfirmAttachmentRequest {
  string ticket_id = 1;
  string message_id = 2;
  string object_path = 3;
  string file_name = 4;
}

message DeleteAttachmentRequest { string attachment_id = 1; }
message DeleteAttachmentResponse {}

message ListAttachmentsRequest {
  string ticket_id = 1;
  string message_id = 2;
}

message ListAttachmentsResponse { repeated AttachmentResponse items = 1; }

message GetAiAttachmentsRequest {
  string message_id = 1;
}

// Field-for-field identical to `synapsedesk.rag.AttachmentPart`, and declared
// here rather than imported.
//
// A proto import would point this package at rag's, which is backwards: rag is
// downstream of ticket, not the other way round. Declaring it twice costs
// nothing at the call site because ts-proto emits structural interfaces, so the
// object ticket-service builds satisfies rag's type without a mapping function
// — the two are kept aligned by that fact rather than by a converter somebody
// has to remember to update.
message AiAttachmentPart {
  string mime_type = 1;
  bytes data = 2;
  // For the boundary label and for logs. NEVER the file's contents.
  string file_name = 3;
}

message GetAiAttachmentsResponse {
  // Already filtered by mime type and capped by total size. Empty is the common
  // case and is not an error.
  repeated AiAttachmentPart parts = 1;
  // File NAMES that did not qualify, so the caller can tell the user
  // Never their contents.
  repeated string skipped = 2;
}

message DownloadAttachmentRequest {
  string attachment_id = 1;
}

message DownloadAttachmentResponse {
  string download_url = 1;
  google.protobuf.Timestamp expires_at = 2;
}

service MessageService {
  rpc CreateMessage(CreateMessageRequest) returns (CreateMessageResponse);
  rpc AppendAiMessage(AppendAiMessageRequest) returns (MessageResponse);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc UpdateMessage(UpdateMessageRequest) returns (MessageResponse);
  rpc RedactMessage(RedactMessageRequest) returns (RedactMessageResponse);
  // The write-back on the refusal path. Called by whoever holds the
  // id of the message that was just refused: the gateway for `Chat`,
  // ticket-service internally for the two `Draft` paths.
  rpc ExcludeFromAiContext(ExcludeFromAiContextRequest) returns (MessageResponse);

  // UploadAttachment is now the PRESIGN step — it returns a URL rather than a
  // stored row, because no row exists until the bytes have actually landed.
  rpc UploadAttachment(UploadAttachmentRequest) returns (PresignAttachmentResponse);
  rpc ConfirmAttachment(ConfirmAttachmentRequest) returns (AttachmentResponse);
  rpc DownloadAttachment(DownloadAttachmentRequest) returns (DownloadAttachmentResponse);
  // The AI-eligible attachments of one message, as bytes.
  //
  // **The gateway asks rather than fetching.** It has no storage client, and
  // giving it one would add a peer and a credential to the chat path for work
  // ticket-service already does for its own two Draft call sites. One
  // implementation of the eligibility rule, in the service that owns the rows.
  rpc GetAiAttachments(GetAiAttachmentsRequest) returns (GetAiAttachmentsResponse);
  rpc DeleteAttachment(DeleteAttachmentRequest) returns (DeleteAttachmentResponse);
  rpc ListAttachments(ListAttachmentsRequest) returns (ListAttachmentsResponse);
}
