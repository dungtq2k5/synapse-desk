syntax = "proto3";

// The STANDARD gRPC Health Checking Protocol
//
// Copied verbatim from grpc/grpc-proto rather than invented, and the package
// name `grpc.health.v1` is the load-bearing part: Kubernetes probes it natively
//
//   livenessProbe:  { grpc: { port: 50051, service: "" } }
//   readinessProbe: { grpc: { port: 50051, service: "readiness" } }
//
// so a bespoke `synapsedesk.health.Check` would need a `grpc_health_probe`
// sidecar in every pod to do exactly what the kubelet already does. A gRPC-only
// service has no HTTP surface, and adding one for a single route means a
// listener, a port and a config surface per service.
package grpc.health.v1;

message HealthCheckRequest {
  // "" means the SERVER as a whole — liveness. "readiness" is the sub-service
  // this codebase registers for the readiness probe, so the two probes ask
  // genuinely different questions over one port.
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    // Used only by Watch, for a service name the server does not know.
    SERVICE_UNKNOWN = 3;
  }
  ServingStatus status = 1;
}

service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);

  // Streaming variant. Declared because it is part of the standard and a client
  // may call it; the implementation refuses it explicitly rather than leaving an
  // UNIMPLEMENTED that reads as "the server is broken".
  rpc Watch(HealthCheckRequest) returns (stream HealthCheckResponse);
}
