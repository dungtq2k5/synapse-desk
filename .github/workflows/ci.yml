# CI — build, lint, typecheck and test. No publishing, no registry, no deploy:
# those need Phase 1's images AND a cluster, and splitting them is what let
# this land now.
#
# **What must never run here**, as a named list rather than an absence — an
# absence and an oversight look identical to whoever adds the next job, and
# `packages/config/src/ci-contract.spec.ts` fails if one appears:
#
#   npm run test:system   DESTRUCTIVE to three stores in setup AND teardown —
#                         flushes the whole dev Redis, drops the Qdrant
#                         collection, resets the JetStream streams — spawns
#                         seven processes, and two of its steps need a live
#                         paid API.
#   npm run db:apply      (no `:test`) targets the DEV databases.
#   npm run db:reset      without --test-only / --dev-only drops dev AND test.
#   seed:demo / stripe:provision / plans:seed with `--apply`
#                         write to a real Stripe sandbox and real databases.
#                         Their dry-run forms are harmless. (e2e-web's setup
#                         runs seed:demo and plans:seed with `--apply` against
#                         the runner's own databases; they only read Stripe.)
name: CI

on:
  push:
    branches: [main, main-java]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # PRs only. On `main` a cancellation leaves the superseded commit having
  # never been fully tested — two quick merges and the first one's result is
  # simply absent, which is indistinguishable from green in the branch
  # history.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Nothing here reads a real credential. The Firebase service accounts are
  # generated synthetically (see the e2e job) and the JWT keys are minted per
  # run, because `cert()` and `readFileSync` only need well-formed material.
  CI: true

jobs:
  # ---------------------------------------------------------------- static
  static:
    name: static (format, lint, typecheck, proto, markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # `.nvmrc` carries the image's exact Node version, and
          # `image-contract.spec.ts` asserts the two agree — a CI that tests a
          # runtime the image does not ship is a CI whose green means less
          # than it looks.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts

      # **Neither check below can run without the Prisma clients.** They are
      # generated into `**/src/generated/prisma/`, which `.gitignore` excludes,
      # so on a fresh clone — which every CI run is — they do not exist and
      # every service that imports one fails to resolve it. Measured on a clean
      # checkout at 88501a1: `typecheck` reported 1438 errors and `lint` 328
      # `no-unsafe-*` findings — one missing module wearing two costumes, since
      # a type eslint cannot resolve is `any` to every type-aware rule.
      #
      # `build` gets this for free — turbo's `build` task `dependsOn`
      # `db:generate` — and neither of these two can. `typecheck` is not a
      # turbo task at all (a root `tsc` over the whole repo), and `lint`'s
      # turbo task declares no `dependsOn` ON PURPOSE, because eslint reads
      # SOURCE and compiling dependencies first would be wasted work. The
      # generated client is source too, which is the part that declaration
      # cannot express. So the workflow is where the dependency gets said.
      #
      # `generate` is both: the Prisma clients and the web's REST client
      # (`packages/api-client/src/generated`, from the committed API
      # document), which the root typecheck reads as source.
      - run: npm run generate

      # **And the libraries built**, for the web app. It resolves
      # `@synapsedesk/api-client` and `@synapsedesk/contracts` by their `main`
      # and `types` (`dist/`), as its bundler does, so on a fresh clone its
      # lint has no types to read and `typecheck`'s turbo half rebuilds them
      # anyway.
      - run: npm run build:libs

      # `lint` is a composite: lint:models && turbo run lint && eslint over the
      # two directories turbo does not own (scripts/seed-demo, test/system),
      # and `lint:md`.
      #
      # **Markdown has no step of its own, deliberately.** A separate step here
      # would be checked by CI and not by the command a developer actually runs,
      # so the first time a doc fails is after the push. Chaining it into `lint`
      # means one habit covers both — and `ci-contract.spec.ts` REQUIRES this
      # invocation, so deleting the line is a red test rather than a silent loss
      # of markdown coverage. Why the house config exists at all, and the
      # before-figures that justify it, live in `.markdownlint-cli2.jsonc`.
      - run: npm run lint

      # `format:check` formats Python too, with the service venv's Ruff. Only
      # Ruff is installed here, at the version `requirements-dev.txt` pins, read
      # from that file so CI and a laptop cannot format differently.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ruff
        run: |
          python -m venv services/rag-service/.venv
          services/rag-service/.venv/bin/pip install -q "$(grep -E '^ruff==' services/rag-service/requirements-dev.txt)"
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run proto:lint

  # ----------------------------------------------------------------- build
  #
  # NOT redundant with `typecheck`, and the reason is recent: every SWC service
  # now carries `"typeCheck": true`, so `nest build` typechecks each service
  # through its OWN `tsconfig.build.json` — a different program from the root
  # `tsc -p tsconfig.json --noEmit` that `static` runs. Different include,
  # different paths (auth's is `"paths": {}` deliberately), different files.
  # Two programs, two answers, and only one of them is the one that ships.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # The production web build: each route's first-load JavaScript within its
      # budget (apps/web/bundle-budgets.json), and no secret in the client
      # bundle. A route that grows past its budget fails here with the number.
      - run: npm run check:web-build

  # -------------------------------------------------------------- contract
  #
  # **The gateway on a runner that has never seen it.** Before this job every
  # gateway result — the contract rows, `mvnw verify`, the ITs — came from one
  # developer's machine, where a warm `~/.m2` and a running compose stack were
  # already there.
  #
  # The harness starts its own Redis and NATS on ephemeral ports.
  #
  # **Four runners, one shard each** (`--shard=k/4`). The serial suite is about
  # 21 minutes on a laptop and outlasted 30 on a runner. A shard on its own
  # runner shares nothing with the others, so `CONTRACT_SHARD`'s port blocks
  # are not needed. Every gateway's output is kept as an artifact when a shard
  # fails: the test's error shows only the tail of it.
  #
  # **Java 21, not whatever the runner defaults to.** It is what `pom.xml`
  # targets; every local run used a newer JDK, which compiles `--release 21`
  # fine and would never notice an API used beyond it.
  contract:
    name: contract (gateway, ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/api-gateway/pom.xml
      # `cache: maven` keeps ~/.m2/repository only; without this, `mvnw`
      # fetches the Maven zip from Maven Central on every run, and a failed
      # fetch fails the job.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('services/api-gateway/.mvn/wrapper/maven-wrapper.properties') }}
      - run: npm ci --ignore-scripts
      - run: npm run build

      # **Minted per run, as the e2e job does.** `JwtVerifier` reads the public
      # half from `services/api-gateway/secrets/`, which is gitignored — so on a
      # runner every Spring context refuses to start, unit tests included.
      # Found on a clean checkout, where 38 contexts failed on this one file;
      # locally it had always simply been there.
      - name: JWT keys
        run: npm run keys:generate -- --force

      # **The shard counts toward Java coverage.** Every gateway it launches runs
      # under the JaCoCo agent the pom pins; `report-contract-coverage.sh` fails if
      # a launch wrote no data, then reports against this shard's own classes
      # (JaCoCo matches classes by their bytes). Sonar merges the four reports
      # with `mvnw verify`'s.
      - name: JaCoCo agent
        working-directory: services/api-gateway
        run: ./mvnw -q dependency:copy@contract-agent
      - run: npm run test:contract:java -- --shard=${{ matrix.shard }}/4
        env:
          CONTRACT_JACOCO_AGENT: services/api-gateway/target/jacoco-agent/jacocoagent.jar
      - run: bash scripts/report-contract-coverage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-contract-${{ matrix.shard }}
          path: services/api-gateway/target/site/jacoco-contract/jacoco.xml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: contract-logs-${{ matrix.shard }}
          path: /tmp/contract-*/

  # **Surefire's unit rows AND failsafe's ITs** — the suites that, before
  # `contract` existed, only ran on a laptop. Their own job, not a step after
  # the contract harness: the two together outlasted one 30-minute budget on a
  # runner (the unsharded harness alone is about 21 minutes on a laptop).
  # It also runs `openapi:check`, whose IT needs the same Redis and NATS: the
  # ITs read `.env.example`'s `localhost:6379` / `localhost:4222`.
  gateway-java-verify:
    name: verify (gateway)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/api-gateway/pom.xml
      # `cache: maven` keeps ~/.m2/repository only; without this, `mvnw`
      # fetches the Maven zip from Maven Central on every run, and a failed
      # fetch fails the job.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('services/api-gateway/.mvn/wrapper/maven-wrapper.properties') }}
      # `openapi:check`'s compare step uses prettier and ajv.
      - run: npm ci --ignore-scripts
      - name: JWT keys
        run: npm run keys:generate -- --force
      - name: stack env
        run: cp .env.example .env
      - name: start the stores the ITs read
        run: docker compose up -d --wait redis nats
      # The committed OpenAPI document is what this gateway serves, and a
      # valid OpenAPI 3.1 document.
      - run: npm run openapi:check
      - run: npm run test:e2e:gateway-java

      # For Sonar: the compiled classes its Java rules read, and JaCoCo's report
      # of the run above (unit rows and ITs).
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-java
          path: |
            services/api-gateway/target/classes
            services/api-gateway/target/site/jacoco/jacoco.xml
          if-no-files-found: error

  # -------------------------------------------------------- gateway images
  #
  # **The image that ships, started.** Every other gateway job runs the code
  # from the checkout; this one builds the gateway image, runs it, and waits
  # for `/health`. Nothing is pushed: an image that cannot start is a PR
  # failure here instead of a deploy failure in CD.
  #
  # The stores come from compose, as `contract` gets them, and the image joins
  # compose's network to reach them.
  gateway-images:
    name: gateway image (build and boot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: stack env
        run: cp .env.example .env
      - name: start the stores the gateway reads
        run: docker compose up -d --wait redis nats
      - run: npm run images:boot-gateway

  # -------------------------------------------------------------- web image
  #
  # The web client's image, built and booted with nothing behind it: the
  # sign-in page renders without the gateway, so this proves the image (the
  # standalone server, its static files, the per-request CSP), not the system.
  web-image:
    name: web image (build and boot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: ./docker/check-images.sh --web-only

  # ---------------------------------------------------------------- e2e-web
  #
  # The web client in Chromium over the whole system: `test/system`'s setup
  # (the stores reset, every service built and started, the demo seeded), the
  # built web app, and the rows in `test/e2e-web`. On a runner every store is
  # this job's own compose stack, so the reset costs nothing.
  #
  # **No secret.** Stripe is the fake `test/system` starts, and the plans
  # seed reads its catalog, so the suite runs offline as it does locally.
  e2e-web:
    name: e2e (web, Playwright)
    runs-on: ubuntu-latest
    # Measured on a runner (2026-10-23, 586 rows): about 14½ minutes before the
    # first row, then about 4 seconds a row, 40 minutes for them all. The rows
    # get 70 (`--global-timeout` below), the job 90 around them.
    # ponytail: one runner; shard like `contract` (`--shard=k/n`, a coverage
    # lcov per shard) once the rows near 70 minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/api-gateway/pom.xml
      # `cache: maven` keeps ~/.m2/repository only; without this, `mvnw`
      # fetches the Maven zip from Maven Central on every run, and a failed
      # fetch fails the job.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('services/api-gateway/.mvn/wrapper/maven-wrapper.properties') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run setup:py

      # Every service reads its own `.env`, and docker-compose.yml the root's;
      # all gitignored, so the examples stand in.
      # auth-service refuses its published SUPER_ADMIN_PASSWORD outside tests,
      # so this run makes one of its own, as a developer is told to. Hex alone
      # has no uppercase letter or symbol; the prefix gives it every class
      # PASSWORD_POLICY asks for. The Super Admin must use two-step, so the run
      # also gives them a two-step secret (base32) the seed and the analytics
      # journeys compute codes from.
      - name: stack env
        run: |
          cp .env.example .env
          for example in services/*/.env.example; do cp "$example" "${example%.example}"; done
          sed -i "s/^SUPER_ADMIN_PASSWORD = .*/SUPER_ADMIN_PASSWORD = Aa1-$(openssl rand -hex 16)/" services/auth-service/.env
          echo "SUPER_ADMIN_TOTP_SECRET = $(openssl rand 20 | base32 | tr -d '=')" >> services/auth-service/.env
      - name: credentials
        run: |
          npm run keys:generate -- --force
          npm run keys:service-account
      - name: start the stack
        run: docker compose up -d --wait
      # `db:apply` runs each service's BUILT `schema-apply.js`, so the four
      # schema services build first (turbo runs `db:generate` before each).
      - name: build the schema services
        run: >-
          ./node_modules/.bin/turbo run build
          --filter=@synapsedesk/auth-service...
          --filter=@synapsedesk/ticket-service...
          --filter=@synapsedesk/notification-service...
          --filter=@synapsedesk/ingestion-service...
      # This runner's own dev databases, created and given their schema the
      # way production does (`db:apply`).
      - name: databases
        run: npm run db:reset -- --dev-only
      # The lockfile's Playwright, never `npx`: npx can fetch a package on
      # demand and run its install scripts.
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      # The harness imports the workspace libraries' `dist` as it loads, before
      # its setup builds anything.
      - run: npm run build:libs
      # The screen rows render in the official Playwright image at the
      # lockfile's version (test/e2e-web/browser-server.ts): pulled here so the
      # suite's own time doesn't include it.
      - name: the Playwright image the screens render in
        run: docker pull "mcr.microsoft.com/playwright:v$(node -p "require('@playwright/test/package.json').version")-noble"

      # **Coverage for Sonar** (`WEB_COVERAGE_DIR`, see
      # test/e2e-web/global-setup.ts): the web is built with source maps, the
      # browser's and the renderer's V8 coverage are collected, and the run
      # ends by writing one lcov in Jest's shape.
      - name: e2e-web
        env:
          SYSTEM_LOG_DIR: ${{ github.workspace }}/e2e-web-logs
          WEB_COVERAGE_DIR: ${{ github.workspace }}/coverage-e2e/web
        # Playwright's own limit, under the job's: a run that hits it stops
        # cleanly and still prints each failure, writes results.xml and keeps
        # the traces. The job's limit kills it before any of that.
        run: npm run test:e2e:web -- --global-timeout=4200000

      # Uploaded when rows failed too: the run writes it either way, and the
      # `sonar` job reads it whatever this job's result.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-web
          path: coverage-e2e/web/lcov.info
          # A run that wrote no lcov would read as uncovered code in Sonar;
          # failing here names the cause.
          if-no-files-found: error

      # The screens rows that passed only on their retry, in the job summary
      # and as warnings: one that's flaky run after run is a fault to find,
      # not noise to live with.
      - name: flaky rows
        if: ${{ !cancelled() && hashFiles('test/e2e-web/results.json') != '' }}
        run: |
          flaky=$(jq -r '
            [.suites[] | recurse(.suites[]?) | .specs[]? as $spec
              | $spec.tests[] | select(.status == "flaky")
              | "\(.projectName) › \($spec.file):\($spec.line) › \($spec.title)"]
            | .[]' test/e2e-web/results.json)
          if [ -z "$flaky" ]; then
            echo "No flaky rows." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Flaky rows (passed only on their retry)"
            echo
            printf '%s\n' "$flaky" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$flaky" | while IFS= read -r row; do
            echo "::warning title=Flaky row::$row"
          done

      # test-results holds each failed screenshot's -actual, -expected and
      # -diff images beside the trace.
      # Canceled too: a run stopped by hand or by a limit leaves the same
      # evidence.
      - name: upload the report, traces, screenshot diffs and service logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web
          path: |
            test/e2e-web/test-results/
            test/e2e-web/results.xml
            test/e2e-web/results.json
            e2e-web-logs/
          if-no-files-found: warn

  # ------------------------------------------------------------- web-vitals
  #
  # Core Web Vitals on the main screens, on the plain production build: the
  # same stack setup as e2e-web, then the `vitals` project alone. Reported in
  # the summary and an artifact; nothing gates on it yet.
  web-vitals:
    name: web vitals (reported)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/api-gateway/pom.xml
      # `cache: maven` keeps ~/.m2/repository only; without this, `mvnw`
      # fetches the Maven zip from Maven Central on every run, and a failed
      # fetch fails the job.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('services/api-gateway/.mvn/wrapper/maven-wrapper.properties') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run setup:py

      # Every service reads its own `.env`, and docker-compose.yml the root's;
      # all gitignored, so the examples stand in.
      # auth-service refuses its published SUPER_ADMIN_PASSWORD outside tests,
      # so this run makes one of its own, as a developer is told to. Hex alone
      # has no uppercase letter or symbol; the prefix gives it every class
      # PASSWORD_POLICY asks for. The Super Admin must use two-step, so the run
      # also gives them a two-step secret (base32) the seed and the analytics
      # journeys compute codes from.
      - name: stack env
        run: |
          cp .env.example .env
          for example in services/*/.env.example; do cp "$example" "${example%.example}"; done
          sed -i "s/^SUPER_ADMIN_PASSWORD = .*/SUPER_ADMIN_PASSWORD = Aa1-$(openssl rand -hex 16)/" services/auth-service/.env
          echo "SUPER_ADMIN_TOTP_SECRET = $(openssl rand 20 | base32 | tr -d '=')" >> services/auth-service/.env
      - name: credentials
        run: |
          npm run keys:generate -- --force
          npm run keys:service-account
      - name: start the stack
        run: docker compose up -d --wait
      # `db:apply` runs each service's BUILT `schema-apply.js`, so the four
      # schema services build first (turbo runs `db:generate` before each).
      - name: build the schema services
        run: >-
          ./node_modules/.bin/turbo run build
          --filter=@synapsedesk/auth-service...
          --filter=@synapsedesk/ticket-service...
          --filter=@synapsedesk/notification-service...
          --filter=@synapsedesk/ingestion-service...
      # This runner's own dev databases, created and given their schema the
      # way production does (`db:apply`).
      - name: databases
        run: npm run db:reset -- --dev-only
      # The lockfile's Playwright, never `npx`: npx can fetch a package on
      # demand and run its install scripts.
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      # The harness imports the workspace libraries' `dist` as it loads, before
      # its setup builds anything.
      - run: npm run build:libs
      # The vitals project on the PLAIN build (no WEB_COVERAGE_DIR): the
      # suite's own run is instrumented for coverage, which slows every page.
      # Reported, not gated: the numbers are this job's summary and artifact.
      - name: web vitals
        env:
          SYSTEM_LOG_DIR: ${{ github.workspace }}/web-vitals-logs
        run: ./node_modules/.bin/playwright test -c test/e2e-web --project=vitals
      - name: the numbers
        if: ${{ !cancelled() && hashFiles('test/e2e-web/test-results/web-vitals.json') != '' }}
        run: |
          {
            echo "### Core Web Vitals (median of three; LCP, INP in ms)"
            echo
            echo "| screen | width | LCP | CLS | INP |"
            echo "| :--- | ---: | ---: | ---: | ---: |"
            jq -r '.[] | "| \(.screen) | \(.width) | \(.lcp) | \(.cls) | \(.inp) |"' test/e2e-web/test-results/web-vitals.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: web-vitals
          path: |
            test/e2e-web/test-results/web-vitals.json
            web-vitals-logs/
          if-no-files-found: warn

  # ------------------------------------------------------------------ unit
  #
  # No infrastructure, by design — `test/system/jest.config.ts` states the
  # property in its own header: "`npm test` must stay runnable on a machine
  # with nothing started." Do not let a unit suite acquire an infrastructure
  # dependency to make a test easier.
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts

      # The same gitignored Prisma clients `static` needs, for the same reason.
      - run: npm run db:generate

      # **And the libraries BUILT, which the mappers hide.** Every jest project
      # resolves `@synapsedesk/common` to `libs/common/src/main.ts`, so the
      # suites themselves need no `dist` — but two things inside the run do:
      # the seeder specs spawn `scripts/generate-job-alerts.mjs`, a real child
      # process where Node resolves the package by its `main`
      # (`packages/contracts/dist/index.js`), and `packages/grpc-proto`'s specs need the
      # `.d.ts` beside it for ts-jest to typecheck against. Measured on a clean
      # checkout with the clients present and no `dist`: 3 suites failed, 100
      # passed; with it, 103 suites / 1127 tests green.
      - run: npm run build:libs

      # **The OCR binaries, because two suites here SPAWN them.** `ocr.spec.ts`
      # rasterises its fixtures with poppler's `pdftoppm` and reads them with
      # tesseract, and `test/utils/ocr-binaries.ts` skips what it can when they
      # are absent — a gate that exists so a developer without them sees skips
      # rather than a red suite, not so CI can go without. Skipped here is
      # coverage nobody is getting, on the one host that can always have it.
      #
      # The same two packages `runtime-ocr` installs, with `apt-get` rather
      # than `apk` and with English alone: that stage carries all eight
      # language packs because tenants upload in eight, and no suite OCRs in
      # anything but English. A suite that does needs its pack added here.
      - name: OCR binaries
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng

      # Coverage for Sonar: one lcov for every project, at the repository root.
      # The directory must be ABSOLUTE: Jest resolves a relative one against the
      # first project's folder, so `coverage` lands in services/api-gateway/.
      - run: npm test -- --coverage --coverageReporters=lcov --coverageDirectory=${{ github.workspace }}/coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/lcov.info
          # The default only warns, which let a misplaced report pass here and
          # fail later in `sonar` as "artifact not found".
          if-no-files-found: error

  # ------------------------------------------------------------------- e2e
  #
  # **One job running the six suites sequentially, deliberately.** Six parallel
  # jobs against one stack would interfere; six parallel jobs on ONE runner
  # would manufacture failures — measured, the six suites take ~3 minutes
  # uncontended and ~2.4x that under CPU contention, with a timeout flake that
  # passed in isolation. That is known gap #13's exact signature: "a poll
  # budget sized for an idle process, expiring when --runInBand gives the box
  # more to do." The case for sequential is not wall-clock, which sequential
  # loses; it is that the alternative shares a CPU and this repo has a
  # documented row about what that does to these suites.
  e2e:
    name: e2e (six suites, sequential)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts

      # docker-compose.yml resolves every `${VAR}` from the root `.env`, which
      # is gitignored — without this the postgres containers come up with no
      # user, no password and no database, and it surfaces as the suites
      # failing to connect. (No number here on purpose: this comment said "16"
      # and was correct until deleting `init-test-db.sh` removed
      # `AUTH_TEST_DB_NAME` in the same phase. `ci-contract.spec.ts` carries
      # the count as a floor, where it cannot go stale silently.)
      - name: stack env
        run: cp .env.example .env

      # **The OCR binaries the ingestion pipeline spawns**, the same two the
      # `unit` job installs — and here they change an ASSERTION, not just a
      # skip. Test 6a of `ingestion-pipeline.e2e-spec.ts` uploads a PDF that
      # OCRs to nothing and asserts the failure names LANGUAGE as the cause,
      # which is the advice the uploader can act on. Without tesseract the
      # pipeline takes its other arm — `OcrUnavailable`, "OCR is not available
      # on this deployment" — a correct message for a DIFFERENT fault, and one
      # the processor picks deliberately so a deployment problem is never
      # reported to a tenant as their file's problem. The test then fails on
      # the shape of the runner rather than on the code.
      - name: OCR binaries
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng

      # `--wait` waits only for services that DECLARE a healthcheck. All eight
      # in the DEFAULT set do — the `observability` profile's Prometheus is not
      # started here, and CI scrapes nothing.
      # now do; the three that did not (nats, qdrant, firebase) were
      # added for this job, because a startup race here would look exactly like
      # known gaps #7/#13/#14 and be misfiled as one of them.
      - name: start the stack
        run: docker compose up -d --wait

      # Test-only material, generated per run rather than stored as secrets:
      # `cert()` parses the JSON and the PEM and makes no network call, and
      # every auth e2e already spies on `verifyGoogleIdToken`, so nothing in
      # this job reaches Google. A real service account here would be a real
      # credential in every fork's PR environment the moment somebody relaxes
      # the trigger.
      #
      # **The TLS pair is here for the same reason the rest of this step is.**
      # Two suites start a real `https` receiver and point production code at
      # it — notification's webhook sender and storage's remote-source fetcher
      # — and `*.pem` is gitignored, so until `keys:test-tls` existed the pair
      # lived only on machines that had once made it by hand. Measured on a
      # clean checkout: `webhooks.e2e-spec.ts` failed all 16 tests with ENOENT
      # before its first assertion, while the other nine suites passed.
      - name: credentials
        run: |
          npm run keys:generate -- --force
          npm run keys:service-account
          npm run keys:test-tls

      # `db:apply` runs each service's BUILT `schema-apply.js`, as the
      # `migrate` image does, so the four schema services build first (turbo
      # runs `db:generate` before each build).
      - name: build the schema services
        run: >-
          ./node_modules/.bin/turbo run build
          --filter=@synapsedesk/auth-service...
          --filter=@synapsedesk/ticket-service...
          --filter=@synapsedesk/notification-service...
          --filter=@synapsedesk/ingestion-service...

      # Creates the four test databases and their shadows, then gives each its
      # schema the way production does (`db:apply:test`: the database check,
      # `migrate deploy`, `schema-apply.js`). So the suites below run on the
      # migrations, and a broken migration fails here.
      - name: test databases
        run: npm run db:reset -- --test-only

      # **The migrations match `schema.prisma`.** Prisma replays each
      # service's migrations into its shadow database and diffs the result
      # with the schema file; `--exit-code` exits 2 on any difference, so a
      # schema change committed without its migration fails the job.
      - name: migrations match the schemas
        run: |
          for service in auth ticket notification ingestion; do
            (cd "services/$service-service" && ../../node_modules/.bin/dotenv -e .env.test -- ../../node_modules/.bin/prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code) || exit 1
          done

      # **`set -o pipefail` is not optional here.** GitHub Actions runs steps
      # under `bash -e` WITHOUT pipefail, so `npm run test:e2e | tee` would
      # report `tee`'s exit status and turn the step green when the suites
      # fail — a considerably worse bug than the missing capture the tee is
      # here to enable. The log is what `capture-e2e-state.mjs` reads for
      # known gap #13's ask: which suites were in the run and how far it got,
      # neither of which the process table can answer for a sequential chain.
      # **Coverage for Sonar** (`E2E_COVERAGE_DIR`, see `jest.config.base.ts`):
      # the suites drive each service in-process, so this is the coverage of
      # code no unit test reaches. One lcov per service.
      - name: e2e suites
        shell: bash
        env:
          E2E_COVERAGE_DIR: ${{ github.workspace }}/coverage-e2e
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-e2e
          path: coverage-e2e/*/lcov.info
          # A run that wrote no lcov would read as uncovered code in Sonar;
          # failing here names the cause.
          if-no-files-found: error

      # **Run-scoped, not spec-scoped** — known gap #13's correction to #7,
      # whose capture instruction is scoped to one spec and so loses the thing
      # it protects (which suites were in the run). The same script a developer
      # runs by hand, because CI structurally cannot reproduce two of these
      # three classes: a runner starts with an empty Redis and an empty
      # JetStream every time, while the machine that keeps producing them
      # accumulates state for weeks.
      - name: capture shared state on failure
        if: failure()
        env:
          E2E_LOG: e2e.log
        run: node scripts/capture-e2e-state.mjs --out ci-artifacts

      - name: upload capture
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-state
          path: ci-artifacts/
          if-no-files-found: warn

  # ---------------------------------------------------------------- python
  python:
    name: python (rag-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The one job that would otherwise run `npm run` four times and a `node`
      # script on whatever Node ubuntu-latest happens to ship — in a phase
      # that added `.nvmrc` and an assertion precisely so that could not
      # happen.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          # Matches the image base, `python:3.12.14-slim-trixie`.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            services/rag-service/requirements.lock
            services/rag-service/requirements-dev.txt

      # `test_multimodal_e2e.py` carries TWO skip marks: one on GEMINI_API_KEY
      # and one on `poppler_available()`. A runner holding the secret and no
      # poppler skips exactly as silently as one holding neither — this is the
      # same binary `runtime-ocr` installs with apk, and it is not optional.
      - name: poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - run: npm run setup:py
      - run: npm run lint:py
      - run: npm run typecheck:py

      # **The pytest suites are not unit tests, and this job used to run them
      # as if they were.** `conftest.py` loads `services/rag-service/.env.test` —
      # tracked, so the addresses were always here — and its `qdrant` and
      # `pool` fixtures connect EAGERLY, with no skip mark to fall back on.
      # Measured with the three stores unreachable, which is what this job was:
      # 325 passed and 191 ERRORED, every one a refused connection rather than
      # a failed assertion. With them up, 514 pass. A suite that cannot reach
      # its stores does not report a smaller truth; it reports nothing, loudly.
      #
      # Three services, not the whole compose file: Qdrant for the vector
      # store, `postgres-ingestion` because rag-service reads the documents
      # ingestion owns, and Redis for the cache. The other five belong to the
      # Node services and this job starts none of them.
      - name: stack env
        run: cp .env.example .env
      - name: start the stores rag-service reads
        run: docker compose up -d --wait qdrant postgres-ingestion redis

      # The `pool` fixture opens with `TRUNCATE TABLE documents CASCADE`, so
      # the ingestion TEST database has to exist AND carry the schema, which
      # belongs to ingestion-service: built (its `db:apply` runs the built
      # `schema-apply.js`), then reset and migrated the way the e2e job's are,
      # for that one service.
      - run: npm ci --ignore-scripts
      - run: ./node_modules/.bin/turbo run build --filter=@synapsedesk/ingestion-service...
      - run: npm run db:reset -- --test-only ingestion-service

      # The key is a repository secret, so it is absent on fork pull requests
      # and the acceptance test skips there. That is acceptable ONLY because
      # the step below makes the skip visible.
      - name: tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run test:py -- --junitxml=pytest.xml -rs --cov=rag_service --cov-report=xml:coverage.xml

      # **The half that works with or without a key.** A test that quietly
      # stops running is the vacuity class arriving through a skip rather than
      # a bad assertion, and "did we supply the key" would pass on a runner
      # that skips for the other reason. This fails when MORE tests skip than
      # the known floor.
      - name: skips are accounted for
        if: always()
        run: node scripts/check-pytest-skips.mjs services/rag-service/pytest.xml

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: services/rag-service/coverage.xml
          if-no-files-found: error

  # ----------------------------------------------------------------- sonar
  #
  # SonarCloud analysis, with the coverage the unit, e2e, e2e-web, python and
  # Java jobs wrote.
  # Skipped when SONAR_TOKEN is absent (a fork's pull request), rather than
  # failing a job the contributor cannot fix. Needs SonarCloud's Automatic
  # Analysis switched off: the two refuse to run on one project.
  sonar:
    name: sonar
    runs-on: ubuntu-latest
    # SonarCloud's plan shows results for its main branch only, and that branch
    # is `main-java`. An analysis of any other ref, a pull request included,
    # is one the plan refuses, so it is not run.
    #
    # **Whatever e2e-web's result,** as long as it ran: one flaky screenshot
    # must not hide the quality gate. e2e-web stays red on its own; its
    # coverage is uploaded either way. Every other job must have passed.
    if: >-
      ${{ !cancelled() && github.ref_name == 'main-java'
      && needs.unit.result == 'success' && needs.e2e.result == 'success'
      && needs.python.result == 'success'
      && needs.gateway-java-verify.result == 'success'
      && needs.contract.result == 'success'
      && needs.e2e-web.result != 'skipped' }}
    needs: [unit, e2e, e2e-web, python, gateway-java-verify, contract]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # The bar new code is held to, read from SonarCloud after the analysis.
      NEW_CODE_COVERAGE_MIN: '90.0'
    steps:
      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          # Full history: blame decides which lines are new code.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: env.SONAR_TOKEN != ''
        with:
          name: coverage-unit
          path: coverage
      - uses: actions/download-artifact@v4
        if: env.SONAR_TOKEN != ''
        with:
          name: coverage-e2e
          path: coverage-e2e
      - uses: actions/download-artifact@v4
        if: env.SONAR_TOKEN != ''
        with:
          name: coverage-python
          path: services/rag-service
      - uses: actions/download-artifact@v4
        if: env.SONAR_TOKEN != ''
        with:
          name: coverage-java
          path: services/api-gateway/target
      - uses: actions/download-artifact@v4
        if: env.SONAR_TOKEN != ''
        with:
          pattern: coverage-contract-*
          path: coverage-contract
      - uses: actions/download-artifact@v4
        if: env.SONAR_TOKEN != ''
        with:
          name: coverage-web
          path: coverage-e2e/web
      # One lcov for Sonar: Jest's reports unioned as Sonar would, the web
      # suite's folded in line by line, because it numbers branches its own
      # way and Sonar's union by key would count them twice
      # (scripts/lib/lcov-merge.cjs).
      - name: merge the JavaScript coverage
        if: env.SONAR_TOKEN != ''
        run: >-
          node scripts/merge-lcov.mjs --out coverage-merged/lcov.info
          --same coverage/lcov.info
          coverage-e2e/auth-service/lcov.info coverage-e2e/ticket-service/lcov.info
          coverage-e2e/notification-service/lcov.info
          coverage-e2e/ingestion-service/lcov.info coverage-e2e/storage-service/lcov.info
          --other coverage-e2e/web/lcov.info
      # Waits for SonarCloud to finish the analysis, so the gate and the
      # coverage read below are this commit's.
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        if: env.SONAR_TOKEN != ''
        with:
          args: -Dsonar.qualitygate.wait=true
      # **New code is held to NEW_CODE_COVERAGE_MIN**, whatever the gate's own
      # condition says: SonarCloud's built-in gate can't be edited.
      - name: new-code coverage
        if: env.SONAR_TOKEN != ''
        run: |
          coverage=$(curl -sf -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/measures/component?component=dungtq2k5_synapse-desk&branch=${GITHUB_REF_NAME}&metricKeys=new_coverage" \
            | jq -r '.component.measures[] | select(.metric == "new_coverage") | (.period.value // .periods[0].value)')
          if [ -z "$coverage" ] || [ "$coverage" = "null" ]; then
            echo "::error::SonarCloud returned no new-code coverage for ${GITHUB_REF_NAME}."
            exit 1
          fi
          echo "New-code coverage: ${coverage}% (needs at least ${NEW_CODE_COVERAGE_MIN}%)"
          if awk -v have="$coverage" -v need="$NEW_CODE_COVERAGE_MIN" 'BEGIN { exit !(have + 0 < need + 0) }'; then
            echo "::error::New-code coverage is ${coverage}%, below ${NEW_CODE_COVERAGE_MIN}%."
            exit 1
          fi
