# The golden set — 17-doc §3.1.
#
# ~30 questions against a fixed corpus (`corpus/`), weighted toward the cases
# that ACTUALLY break rather than spread evenly over the ones that are easy to
# write. The distribution is the design:
#
#   8-10 straightforward — one document, one clear answer. The baseline; a
#        regression here means retrieval itself broke.
#   5    multilingual    — 17-doc §2.1 made permanently visible. Retrieval
#        works (the embedding model is multilingual), the sources are English,
#        and before the prompt fix the answers came back in English.
#   5    exact-string    — policy numbers and error codes. The ONLY proof the
#        lexical arm contributes anything: semantic search paraphrases, and a
#        question whose answer is "P-4471" is answered by BM25 or not at all.
#   5    DOC_MISSING     — nothing in the corpus covers it. Any answer at all
#        is a failure, and this is the class with real product consequences:
#        an invented policy is worse than no answer, every time.
#   5    ambiguous       — spread across documents, or answerable two ways.
#        Where reranking earns its cost.
#
# `must_contain` is deliberately a SUBSTRING rather than a full expected
# answer. Grading generated prose against a reference is its own research
# problem; asking whether the number that matters appears is not.

- id: leave-carryover
  category: straightforward
  q: "how much annual leave carries over?"
  must_cite: [handbook.md]
  must_contain: ["5 days"]
  language: en

