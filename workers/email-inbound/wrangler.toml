name = "synapsedesk-email-inbound"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# `WEBHOOK_URL` is not a secret and belongs in version control; the signing key
# is, and does not. Set it with:
#
#   wrangler secret put INBOUND_SECRET
#
# It must match `INBOUND_EMAIL_SECRET` byte for byte — and that variable has
# THREE holders, not two, which is what makes a partial rotation worse than a
# wrong one:
#
#   this Worker                 signs the webhook request
#   api-gateway                 verifies that signature, AND parses the
#                               per-ticket reply token in the address
#   notification-service        MINTS that reply token into `Reply-To`
#
# `libs/common/src/configs/inbound-email.config.ts` opens by saying so — "One
# definition, three readers."
#
# **The two agreements fail in opposite directions and only one is loud.** A
# mismatch here is a 401 on every message. The Worker DROPS each one — it
# returns rather than throwing, because throwing is what makes Cloudflare retry
# and no number of retries fixes a wrong secret. The durable signal is the
# gateway's counter, `inbound_email_webhook_total{outcome="rejected_signature"}`;
# this Worker retains nothing itself. A mismatch between notification-service
# and the gateway is silent:
# `parseTicketReplyToken` returns null, every customer reply opens a NEW ticket
# instead of threading — correctly, since threading a stranger's mail onto
# somebody else's conversation is a disclosure — and nothing logs an error. It
# surfaces weeks later as "threading stopped working". Rotate all three at once.
[vars]
WEBHOOK_URL = "https://api.example.test/api/v1/webhooks/email/inbound"

# Where attachments are presigned, BEFORE the webhook. Set
# alongside `WEBHOOK_URL` rather than derived from it: deriving assumes the two
# always share a host, and a split deployment would fail with a 404 nobody can
# read from a Worker log.
ATTACHMENTS_URL = "https://api.example.test/api/v1/webhooks/email/attachments"
