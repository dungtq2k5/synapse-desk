sonar.projectKey=dungtq2k5_synapse-desk
sonar.organization=dungtq2k5
sonar.projectName=synapse-desk
sonar.sourceEncoding=UTF-8

# Tests are analysed as tests, not as production code: test-only rules apply to
# them, and they stay out of the duplication figure. A file may be indexed once,
# so the test patterns leave the sources (sonar.exclusions) and are the only
# thing the tests take (sonar.test.inclusions).
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.spec.ts,**/*-spec.ts,**/test/**,**/tests/**,\
packages/testing/**

# Generated or vendored: never analysed. Then the test patterns, as above.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.turbo/**,\
**/target/**,**/.venv/**,docs/archive/**,graphify-out/**,\
packages/grpc-proto/src/generated/**,services/rag-service/rag_service/generated/**,\
services/api-gateway/src/main/java/com/synapsedesk/gateway/contracts/**,\
k8s/generated/**,docs/reference/openapi.json,docs/reference/schema.gql,\
**/*.spec.ts,**/*-spec.ts,**/test/**,**/tests/**,packages/testing/**

# Not measured for coverage: developer CLI entry points (specs that touch
# them spawn them as child processes, which Jest never instruments), the image
# scripts, and Jest's own configs. `scripts/*.mjs` is top-level only, so
# scripts/lib/** and scripts/seed-demo/**, which specs import, stay measured.
sonar.coverage.exclusions=scripts/*.mjs,docker/**/*.sh,**/jest.config.ts,\
**/jest.e2e.config.ts

# Coverage, written by CI's unit and python jobs: one lcov for every Jest project
# (written at the repository root), and pytest-cov's XML.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.version=3.12
sonar.python.coverage.reportPaths=services/rag-service/coverage.xml

# Java: Sonar's Java rules read the compiled classes, and coverage comes from
# JaCoCo (unit rows and ITs in one report, written by `mvnw verify`).
sonar.java.binaries=services/api-gateway/target/classes
sonar.coverage.jacoco.xmlReportPaths=services/api-gateway/target/site/jacoco/jacoco.xml
